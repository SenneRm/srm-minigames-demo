   Ambulance minigames (15). Each build* function receives (difficulty, timeLimit).
   ========================================================================= */

/* =========================================================================
   1) CPR RHYTHM
   Beat indicator pulses at a set tempo. Press SPACE to match it.
   ========================================================================= */
function buildCPR(difficulty, timeLimit) {
  const targetBpm = 100; // adult CPR target
  const beatMs = Math.round(60000 / targetBpm);
  const tolerance = { easy: 260, medium: 180, hard: 110 }[difficulty];
  const beatsNeeded = { easy: 5, medium: 8, hard: 12 }[difficulty];
  const maxMisses = { easy: 4, medium: 3, hard: 2 }[difficulty];
  let beats = 0, misses = 0, lastBeatTime = null;
  setLives(maxMisses, maxMisses - misses);

  const wrap = document.createElement('div');
  wrap.className = 'cpr-wrap';
  wrap.innerHTML = `
    <div class="cpr-bpm" id="bpmDisplay">--</div>
    <div class="cpr-target">${t('cpr.target_label', { target: targetBpm })}</div>
    <div class="cpr-beat" id="beatCircle"></div>
    <div class="cpr-history" id="history"></div>
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('cpr.hint', { beats: beatsNeeded });
  stage.appendChild(hint);

  const beatCircle = wrap.querySelector('#beatCircle');
  const bpmDisplay = wrap.querySelector('#bpmDisplay');
  const historyEl  = wrap.querySelector('#history');
  for (let i=0;i<beatsNeeded;i++){ const p=document.createElement('div'); p.className='cpr-pip'; historyEl.appendChild(p); }

  // pulse the circle at target rhythm to give visual cue
  let raf, pulsePhase = 0;
  const startTime = Date.now();
  function loop(){
    pulsePhase = ((Date.now()-startTime) % beatMs) / beatMs;
    beatCircle.classList.toggle('pulse', pulsePhase < 0.18);
    raf = requestAnimationFrame(loop);
  }
  loop();

  function onKey(e){
    if(e.code !== 'Space') return;
    e.preventDefault();
    const now = Date.now();
    // measure how close to the beat we are
    const phase = ((now - startTime) % beatMs);
    const distToBeat = Math.min(phase, beatMs - phase);
    const actualBpm = lastBeatTime ? Math.round(60000/(now-lastBeatTime)) : null;
    lastBeatTime = now;
    if(actualBpm) bpmDisplay.textContent = actualBpm;

    if(distToBeat <= tolerance){
      historyEl.children[beats].classList.add('ok');
      beats++;
      flashResult(true);
      if(beats >= beatsNeeded){ finish(true,{beats}); return; }
    } else {
      historyEl.children[beats].classList.add('miss');
      flashResult(false);
      misses++;
      setLives(maxMisses, maxMisses-misses);
      if(misses >= maxMisses){ finish(false,{reason:'poor_rhythm'}); return; }
    }
  }
  window.addEventListener('keydown', onKey);
  current.cleanup = ()=>{ cancelAnimationFrame(raf); window.removeEventListener('keydown',onKey); };
  startTimer(timeLimit, ()=>finish(false,{reason:'timeout'}));
}

/* =========================================================================
   2) DEFIBRILLATOR
   A gauge charges continuously. Hit SPACE when inside the green joule zone.
   ========================================================================= */
function buildDefib(difficulty, timeLimit){
  const minJ = { easy:120, medium:150, hard:170 }[difficulty];
  const maxJ = { easy:220, medium:200, hard:195 }[difficulty];
  const maxAttempts = { easy:4, medium:3, hard:2 }[difficulty];
  let attempts = 0;
  setLives(maxAttempts, maxAttempts-attempts);

  const totalJ = 360;
  const speed = { easy:0.6, medium:0.9, hard:1.3 }[difficulty]; // J per tick
  let joules = 0, dir = 1;

  const wrap = document.createElement('div');
  wrap.className = 'defib-wrap';
  const zoneLeft = (minJ/totalJ)*100, zoneWidth = ((maxJ-minJ)/totalJ)*100;
  wrap.innerHTML = `
    <div class="defib-readout" id="defibReadout">0 J</div>
    <div class="defib-label">${t('defib.zone_label',{min:minJ,max:maxJ})}</div>
    <div class="defib-gauge">
      <div class="defib-fill" id="defibFill"></div>
      <div class="defib-zone" style="left:${zoneLeft}%;width:${zoneWidth}%"></div>
    </div>
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('defib.hint');
  stage.appendChild(hint);

  const fill = wrap.querySelector('#defibFill');
  const readout = wrap.querySelector('#defibReadout');

  let raf;
  function loop(){
    joules += speed * dir;
    if(joules >= totalJ){ joules = totalJ; dir = -1; }
    if(joules <= 0){ joules = 0; dir = 1; }
    fill.style.width = (joules/totalJ*100)+'%';
    readout.textContent = Math.round(joules)+' J';
    readout.style.color = (joules>=minJ && joules<=maxJ) ? 'var(--green)' : 'var(--amber)';
    raf = requestAnimationFrame(loop);
  }
  loop();

  function onKey(e){
    if(e.code !== 'Space') return;
    e.preventDefault();
    attempts++;
    if(joules >= minJ && joules <= maxJ){
      finish(true,{joules:Math.round(joules), attempts});
    } else {
      flashResult(false);
      setLives(maxAttempts, maxAttempts-attempts);
      if(attempts >= maxAttempts) finish(false,{reason:'wrong_energy'});
    }
  }
  window.addEventListener('keydown', onKey);
  current.cleanup = ()=>{ cancelAnimationFrame(raf); window.removeEventListener('keydown',onKey); };
  startTimer(timeLimit, ()=>finish(false,{reason:'timeout'}));
}

/* =========================================================================
   3) VITALS ASSESSMENT
   Show a set of patient vitals; one is outside normal range. Click it.
   ========================================================================= */
function buildVitals(difficulty, timeLimit){
  const maxMisses = { easy:3, medium:2, hard:1 }[difficulty];
  let misses = 0;
  setLives(maxMisses, maxMisses-misses);

  const readings = t('vitals.readings');
  const selected = shuffle(readings).slice(0, { easy:4, medium:5, hard:6 }[difficulty]);

  // generate values: one abnormal, rest normal
  const abnormalIdx = randInt(0, selected.length-1);
  const cards = selected.map((r, i) => {
    if(r.values){
      // categorical vital (e.g. pupils)
      const isAbnormal = (i === abnormalIdx);
      return { ...r, display: isAbnormal ? pick(r.abnormal) : r.values[0], isAbnormal };
    }
    const [lo,hi] = r.normal;
    let v;
    if(i === abnormalIdx){
      v = Math.random()<0.5 ? rand(lo*0.55, lo*0.88) : rand(hi*1.12, hi*1.45);
    } else {
      v = rand(lo, hi);
    }
    const formatted = r.format.includes('.1f') ? v.toFixed(1) : r.format.includes('.2f') ? v.toFixed(2) : Math.round(v).toString();
    return { ...r, display: formatted, isAbnormal: i === abnormalIdx };
  });

  const wrap = document.createElement('div');
  wrap.className = 'vitals-wrap';
  const grid = document.createElement('div');
  grid.className = 'vitals-grid';
  wrap.appendChild(grid);
  stage.appendChild(wrap);

  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('vitals.hint');
  stage.appendChild(hint);

  cards.forEach(c => {
    const card = document.createElement('div');
    card.className = 'vital-card';
    card.innerHTML = `<div class="vital-name">${c.name}</div>
      <div class="vital-value">${c.display} <span class="vital-unit">${c.unit}</span></div>`;
    card.onclick = () => {
      if(c.isAbnormal){
        finish(true,{vital:c.name});
      } else {
        card.classList.add('miss-flash');
        flashResult(false);
        misses++;
        setLives(maxMisses, maxMisses-misses);
        setTimeout(()=>card.classList.remove('miss-flash'),300);
        if(misses >= maxMisses) finish(false,{reason:'too_many_misses'});
      }
    };
    grid.appendChild(card);
  });

  startTimer(timeLimit, ()=>finish(false,{reason:'timeout'}));
}

/* =========================================================================
   4) IV LINE INSERTION
   Mouse-controlled cursor must stay inside an SVG vein path.
   ========================================================================= */
function buildIVLine(difficulty, timeLimit){
  const tolerance = { easy:18, medium:12, hard:8 }[difficulty];
  const allowedOffMs = { easy:1800, medium:1000, hard:600 }[difficulty];
  const w = 440, h = 140;

  // straight-ish vein with slight curves
  const pts = [];
  const segs = 6;
  for(let i=0;i<=segs;i++){
    pts.push([(w/segs)*i, h/2 + (i%2===0?1:-1)*rand(10,28)*(i>0&&i<segs?1:0)]);
  }
  const d = pts.map((p,i)=>(i===0?`M ${p[0]} ${p[1]}`:`L ${p[0]} ${p[1]}`)).join(' ');

  const wrap = document.createElement('div');
  wrap.className = 'iv-wrap';
  wrap.innerHTML = `
    <svg class="iv-svg" id="ivSvg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none">
      <path d="${d}" stroke="#2c2e33" stroke-width="${tolerance*2}" fill="none" stroke-linecap="round"/>
      <path d="${d}" stroke="var(--green)" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
      <circle id="needleTip" r="5" fill="var(--amber)"/>
      <circle id="ivCursor" r="4" fill="none" stroke="var(--cyan)" stroke-width="2"/>
    </svg>
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('ivline.hint');
  stage.appendChild(hint);

  const svg = wrap.querySelector('#ivSvg');
  const pathEl = svg.querySelector('path');
  const tipEl = wrap.querySelector('#needleTip');
  const cursorEl = wrap.querySelector('#ivCursor');
  const totalLen = pathEl.getTotalLength();

  let mouse = { x:w/2, y:h/2 }, offTime = 0, elapsed = 0;

  function onMove(e){
    const rect = svg.getBoundingClientRect();
    mouse.x = (e.clientX - rect.left) * (w/rect.width);
    mouse.y = (e.clientY - rect.top) * (h/rect.height);
  }
  svg.addEventListener('mousemove', onMove);

  let raf, last = Date.now();
  function loop(){
    const now = Date.now(), dt = now-last; last = now;
    elapsed += dt;
    const progress = clamp(elapsed/timeLimit, 0, 1);
    const pt = pathEl.getPointAtLength(progress * totalLen);
    tipEl.setAttribute('cx', pt.x);
    tipEl.setAttribute('cy', pt.y);
    cursorEl.setAttribute('cx', mouse.x);
    cursorEl.setAttribute('cy', mouse.y);
    const dist = Math.hypot(mouse.x-pt.x, mouse.y-pt.y);
    if(dist > tolerance){
      offTime += dt;
      tipEl.setAttribute('fill','var(--red)');
      cursorEl.setAttribute('stroke','var(--red)');
    } else {
      tipEl.setAttribute('fill','var(--amber)');
      cursorEl.setAttribute('stroke','var(--cyan)');
    }
    if(offTime >= allowedOffMs){ finish(false,{reason:'missed_vein'}); return; }
    if(progress >= 1){ finish(true,{offTime}); return; }
    raf = requestAnimationFrame(loop);
  }
  loop();
  current.cleanup = ()=>{ cancelAnimationFrame(raf); svg.removeEventListener('mousemove',onMove); };
  startTimer(timeLimit, ()=>{});
}

/* =========================================================================
   5) MEDICATION DOSAGE
   Patient details shown; pick the correctly calculated dose.
   ========================================================================= */
function buildDosage(difficulty, timeLimit){
  const maxMisses = { easy:3, medium:2, hard:1 }[difficulty];
  let misses = 0;
  setLives(maxMisses, maxMisses-misses);

  const cases = t('dosage.cases');
  const c = pick(cases);
  const [wLo, wHi] = c.weightRange;
  const weight = randInt(wLo, wHi);
  const exact = weight * c.perKg;
  const correct = parseFloat(exact.toFixed(c.decimals));

  // generate 3 plausible wrong answers
  const wrongs = new Set();
  while(wrongs.size < 3){
    const delta = pick([-0.3,-0.2,-0.1,0.1,0.2,0.3,0.5,-0.5,1,-1,2,-2]) * c.perKg * weight;
    const w = parseFloat((correct+delta).toFixed(c.decimals));
    if(w > 0 && w !== correct) wrongs.add(w);
  }
  const opts = shuffle([correct, ...[...wrongs]]);

  const wrap = document.createElement('div');
  wrap.className = 'dosage-wrap';
  wrap.innerHTML = `
    <div class="dosage-brief">
      <strong>Drug:</strong> ${c.drug}<br>
      <strong>Patient weight:</strong> ${weight} kg<br>
      <strong>Prescribed dose:</strong> ${c.perKg} mg/kg
    </div>
    <div class="dosage-formula">${t('dosage.formula')}</div>
    <div class="dosage-options" id="opts"></div>
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('dosage.hint');
  stage.appendChild(hint);

  const optsEl = wrap.querySelector('#opts');
  opts.forEach(v => {
    const btn = document.createElement('div');
    btn.className = 'dosage-opt';
    btn.textContent = `${v} ${c.unit}`;
    btn.onclick = () => {
      if(btn.dataset.resolved) return;
      if(v === correct){
        finish(true,{drug:c.drug, dose:correct, weight});
      } else {
        btn.dataset.resolved = '1';
        btn.classList.add('miss-flash');
        flashResult(false);
        misses++;
        setLives(maxMisses, maxMisses-misses);
        setTimeout(()=>btn.classList.remove('miss-flash'),300);
        if(misses >= maxMisses) finish(false,{reason:'wrong_dose'});
      }
    };
    optsEl.appendChild(btn);
  });

  startTimer(timeLimit, ()=>finish(false,{reason:'timeout'}));
}

/* =========================================================================
   6) AIRWAY SEQUENCE
   Drag-and-drop to order the 5 emergency airway steps correctly.
   ========================================================================= */
function buildAirway(difficulty, timeLimit){
  const steps = [...t('airway.steps')];
  const correct = [...steps]; // original order is the correct order
  const shuffled = shuffle([...steps]);

  const wrap = document.createElement('div');
  wrap.className = 'airway-wrap';
  wrap.innerHTML = `<div class="airway-steps" id="stepList"></div>`;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('airway.hint');
  stage.appendChild(hint);

  const list = wrap.querySelector('#stepList');
  let dragging = null;

  function renderSteps(arr){
    list.innerHTML = '';
    arr.forEach((s, i) => {
      const el = document.createElement('div');
      el.className = 'airway-step';
      el.draggable = true;
      el.dataset.idx = i;
      el.innerHTML = `<span class="step-num">${i+1}.</span> ${s}`;
      el.addEventListener('dragstart', ()=>{ dragging = i; el.classList.add('dragging'); });
      el.addEventListener('dragend', ()=>{ dragging=null; el.classList.remove('dragging'); });
      el.addEventListener('dragover', e=>{ e.preventDefault(); });
      el.addEventListener('drop', ()=>{
        if(dragging === null || dragging === i) return;
        const newArr = [...arr];
        const [moved] = newArr.splice(dragging, 1);
        newArr.splice(i, 0, moved);
        renderSteps(newArr);
      });
      list.appendChild(el);
    });
  }
  renderSteps(shuffled);

  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'btn primary airway-confirm';
  confirmBtn.textContent = t('airway.confirm_btn');
  confirmBtn.onclick = () => {
    const current_order = [...list.children].map(el => el.textContent.replace(/^\d+\.\s*/,'').trim());
    const isCorrect = current_order.every((s,i) => s === correct[i]);
    if(isCorrect){
      finish(true,{});
    } else {
      flashResult(false);
      finish(false,{reason:'wrong_order'});
    }
  };
  stage.appendChild(confirmBtn);

  startTimer(timeLimit, ()=>finish(false,{reason:'timeout'}));
}

/* =========================================================================
   7) TRIAGE
   One patient at a time; assign immediate / delayed / minor.
   ========================================================================= */
function buildTriage(difficulty, timeLimit){
  const patients = shuffle(t('triage.patients'));
  const count = { easy:3, medium:4, hard:5 }[difficulty];
  const selected = patients.slice(0, count);
  const cats = t('triage.categories');
  let idx = 0, correct = 0, wrong = 0;
  const maxWrong = { easy:2, medium:1, hard:0 }[difficulty];
  setLives(maxWrong+1, maxWrong+1-wrong);

  const wrap = document.createElement('div');
  wrap.className = 'triage-wrap';
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('triage.hint');
  stage.appendChild(hint);

  function renderPatient(){
    if(idx >= selected.length){ finish(true,{correct,total:selected.length}); return; }
    const p = selected[idx];
    wrap.innerHTML = `
      <div class="triage-patient">${p.desc}</div>
      <div class="triage-btns">
        <button class="triage-btn t-immediate" data-cat="immediate">${cats.immediate}</button>
        <button class="triage-btn t-delayed" data-cat="delayed">${cats.delayed}</button>
        <button class="triage-btn t-minor" data-cat="minor">${cats.minor}</button>
      </div>
    `;
    wrap.querySelectorAll('.triage-btn').forEach(btn=>{
      btn.onclick = () => {
        if(btn.dataset.cat === p.correct){
          correct++; idx++;
          flashResult(true);
          setTimeout(renderPatient, 220);
        } else {
          wrong++;
          setLives(maxWrong+1, maxWrong+1-wrong);
          flashResult(false);
          if(wrong > maxWrong){ finish(false,{reason:'wrong_triage', correct}); return; }
          btn.disabled = true;
        }
      };
    });
  }
  renderPatient();
  startTimer(timeLimit, ()=>finish(false,{reason:'timeout', correct}));
}

/* =========================================================================
   8) WOUND DRESSING
   Three-stage skill bar (clean → pack → secure).
   ========================================================================= */
function buildWoundDress(difficulty, timeLimit){
  const speed = { easy:1.4, medium:2.2, hard:3.2 }[difficulty];
  const zoneWidth = { easy:80, medium:56, hard:38 }[difficulty];
  const trackWidth = 440;
  const stages = t('wounddress.stages');
  let stage_idx = 0, misses = 0;
  const maxMisses = 3;
  setLives(maxMisses, maxMisses-misses);

  const wrap = document.createElement('div');
  wrap.className = 'bar-wrap';
  wrap.innerHTML = `
    <div class="section-label" id="stageLabel">${stages[0]}</div>
    <div style="height:8px"></div>
    <div class="bar-track" style="width:${trackWidth}px">
      <div class="bar-zone" id="zone"></div>
      <div class="bar-marker" id="marker"></div>
    </div>
    <div class="bar-progress" id="progress"></div>
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('wounddress.hint');
  stage.appendChild(hint);

  const zoneEl = wrap.querySelector('#zone');
  const markerEl = wrap.querySelector('#marker');
  const progressEl = wrap.querySelector('#progress');
  const stageLabelEl = wrap.querySelector('#stageLabel');

  stages.forEach(()=>{ const p=document.createElement('div'); p.className='bar-pip'; progressEl.appendChild(p); });

  function newZone(){ const x=randInt(0,trackWidth-zoneWidth); zoneEl.style.left=x+'px'; zoneEl.style.width=zoneWidth+'px'; }
  newZone();

  let pos=0, dir=1, raf;
  function loop(){ pos+=speed*dir; if(pos>=trackWidth-4)dir=-1; if(pos<=0)dir=1; markerEl.style.left=pos+'px'; raf=requestAnimationFrame(loop); }
  loop();

  function onKey(e){
    if(e.code !== 'Space') return;
    e.preventDefault();
    const zl = parseFloat(zoneEl.style.left);
    if(pos>=zl && pos<=zl+zoneWidth){
      progressEl.children[stage_idx].classList.add('done');
      stage_idx++;
      flashResult(true);
      if(stage_idx >= stages.length){ finish(true,{stages:stages.length}); return; }
      stageLabelEl.textContent = stages[stage_idx];
      newZone();
    } else {
      flashResult(false); misses++;
      setLives(maxMisses, maxMisses-misses);
      if(misses >= maxMisses) finish(false,{reason:'too_many_misses'});
    }
  }
  window.addEventListener('keydown', onKey);
  current.cleanup = ()=>{ cancelAnimationFrame(raf); window.removeEventListener('keydown',onKey); };
  startTimer(timeLimit, ()=>finish(false,{reason:'timeout'}));
}

/* =========================================================================
   9) BLOOD PRESSURE MATCHING
   Two sliders for systolic and diastolic; hold both in range.
   ========================================================================= */
function buildBloodPressure(difficulty, timeLimit){
  const tolerance = { easy:8, medium:5, hard:3 }[difficulty];
  const holdNeeded = { easy:1200, medium:900, hard:650 }[difficulty];

  const targetSys = randInt(100,160);
  const targetDia = randInt(60,100);
  let valSys = randInt(80,180), valDia = randInt(50,110);
  let holdMs = 0;

  const wrap = document.createElement('div');
  wrap.className = 'bp-wrap';
  wrap.innerHTML = `
    <div class="bp-readout" id="bpReadout">${valSys}/${valDia}</div>
    <div class="bp-target">${t('bloodpressure.target_label',{sys:targetSys,dia:targetDia})}</div>
    <div class="bp-sliders">
      <div class="bp-row"><label>${t('bloodpressure.systolic_label')}</label><input type="range" min="60" max="220" value="${valSys}" id="sliderSys"></div>
      <div class="bp-row"><label>${t('bloodpressure.diastolic_label')}</label><input type="range" min="40" max="130" value="${valDia}" id="sliderDia"></div>
    </div>
    <div class="bp-lock"><div class="bp-lock-fill" id="lockFill"></div></div>
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('bloodpressure.hint');
  stage.appendChild(hint);

  const readout = wrap.querySelector('#bpReadout');
  const lockFill = wrap.querySelector('#lockFill');
  const sliderSys = wrap.querySelector('#sliderSys');
  const sliderDia = wrap.querySelector('#sliderDia');

  function update(){ valSys=+sliderSys.value; valDia=+sliderDia.value; readout.textContent=`${valSys}/${valDia}`; }
  sliderSys.addEventListener('input', update);
  sliderDia.addEventListener('input', update);

  function inRange(){ return Math.abs(valSys-targetSys)<=tolerance && Math.abs(valDia-targetDia)<=tolerance; }

  let raf;
  function loop(){
    if(inRange()){
      holdMs += 16;
      readout.style.color='var(--green)';
      lockFill.style.width=clamp((holdMs/holdNeeded)*100,0,100)+'%';
      if(holdMs >= holdNeeded){ finish(true,{systolic:valSys,diastolic:valDia}); return; }
    } else {
      holdMs = Math.max(0, holdMs-30);
      readout.style.color='var(--cyan)';
      lockFill.style.width=clamp((holdMs/holdNeeded)*100,0,100)+'%';
    }
    raf = requestAnimationFrame(loop);
  }
  loop();

  current.cleanup = ()=>{ cancelAnimationFrame(raf); sliderSys.removeEventListener('input',update); sliderDia.removeEventListener('input',update); };
  startTimer(timeLimit, ()=>finish(false,{reason:'timeout'}));
}

/* =========================================================================
   10) PATIENT HISTORY
   Given a suspected diagnosis, click the symptom that doesn't fit.
   ========================================================================= */
function buildPatientHistory(difficulty, timeLimit){
  const maxMisses = { easy:2, medium:1, hard:0 }[difficulty];
  let misses = 0;
  setLives(maxMisses+1, maxMisses+1-misses);

  const cases = t('patienthistory.cases');
  const c = pick(cases);
  const symptoms = shuffle(c.symptoms);

  const fact = document.createElement('div');
  fact.className = 'phist-fact';
  fact.textContent = t('patienthistory.fact_prefix') + c.diagnosis;
  stage.appendChild(fact);

  const list = document.createElement('div');
  list.className = 'card-list';
  stage.appendChild(list);

  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('patienthistory.hint');
  stage.appendChild(hint);

  symptoms.forEach(s=>{
    const item = document.createElement('div');
    item.className = 'card-item';
    item.textContent = s.text;
    item.onclick = ()=>{
      if(s.bad){
        finish(true,{});
      } else {
        item.classList.add('miss-flash');
        flashResult(false);
        misses++;
        setLives(maxMisses+1, maxMisses+1-misses);
        setTimeout(()=>item.classList.remove('miss-flash'),300);
        if(misses > maxMisses) finish(false,{reason:'wrong_symptom'});
      }
    };
    list.appendChild(item);
  });

  startTimer(timeLimit, ()=>finish(false,{reason:'timeout'}));
}

/* =========================================================================
   11) ECG READING
   Show a description, then pick the matching SVG rhythm strip.
   ========================================================================= */
function buildECGReading(difficulty, timeLimit){
  const maxMisses = { easy:3, medium:2, hard:1 }[difficulty];
  let misses = 0;
  setLives(maxMisses, maxMisses-misses);

  const rhythms = t('ecgreading.rhythms');
  const target = pick(rhythms);
  const distractors = shuffle(rhythms.filter(r=>r.label!==target.label)).slice(0, 3);
  const options = shuffle([target, ...distractors]);

  function drawECG(r, w, h){
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
    svg.setAttribute('width',w); svg.setAttribute('height',h);
    const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
    bg.setAttribute('width',w); bg.setAttribute('height',h);
    bg.setAttribute('fill','#25262b'); svg.appendChild(bg);

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const pts = generateECGPath(r, w, h);
    path.setAttribute('d', pts);
    path.setAttribute('stroke','var(--green)');
    path.setAttribute('stroke-width','1.5');
    path.setAttribute('fill','none');
    svg.appendChild(path);
    return svg;
  }

  function generateECGPath(r, w, h){
    const mid = h/2;
    let pts = `M 0 ${mid}`;
    const cycles = Math.max(1, Math.floor(r.rate / 20));

    if(r.qrs === 'chaotic'){
      // VF: random jagged noise
      let x = 0;
      while(x < w){
        x += rand(3,9);
        pts += ` L ${x} ${mid + rand(-h*0.35, h*0.35)}`;
      }
      return pts;
    }

    const cycleW = r.rate > 0 ? Math.min(w/Math.max(cycles,1), w) : w;
    for(let c=0;c<Math.ceil(w/cycleW);c++){
      const ox = c * cycleW;
      if(ox > w) break;
      const scale = r.qrs === 'wide' ? 1.6 : 1.0;

      if(r.p && r.rate < 160){
        // P wave
        pts += ` L ${ox+cycleW*0.12} ${mid} C ${ox+cycleW*0.15} ${mid-h*0.12}, ${ox+cycleW*0.20} ${mid-h*0.12}, ${ox+cycleW*0.22} ${mid}`;
      }
      // Q dip
      pts += ` L ${ox+cycleW*0.32} ${mid}`;
      pts += ` L ${ox+cycleW*0.33} ${mid+h*0.08*scale}`;
      // R spike
      pts += ` L ${ox+cycleW*0.35} ${mid-h*(r.rate>150?0.28:0.38)*scale}`;
      // S dip
      pts += ` L ${ox+cycleW*0.37} ${mid+h*0.10*scale}`;
      pts += ` L ${ox+cycleW*0.42} ${mid}`;
      if(r.st === 'normal'){
        pts += ` L ${ox+cycleW*0.55} ${mid}`;
      }
      pts += ` L ${ox+cycleW*0.98} ${mid}`;
    }
    return pts;
  }

  const wrap = document.createElement('div');
  wrap.className = 'ecg-wrap';
  wrap.innerHTML = `<div class="ecg-label">${t('ecgreading.hint')}</div>
    <div style="font-family:var(--sans);font-size:13px;color:var(--cyan);margin-bottom:10px;">${target.label}</div>`;
  const targetSvg = drawECG(target, 440, 80);
  targetSvg.style.border = '1px solid var(--green)';
  targetSvg.style.borderRadius = '6px';
  targetSvg.style.marginBottom = '12px';
  wrap.appendChild(targetSvg);

  const grid = document.createElement('div');
  grid.className = 'ecg-grid';
  wrap.appendChild(grid);
  stage.appendChild(wrap);

  options.forEach(r => {
    const tile = document.createElement('div');
    tile.className = 'ecg-tile';
    tile.appendChild(drawECG(r, 200, 60));
    tile.onclick = () => {
      if(tile.dataset.resolved) return;
      if(r.label === target.label){
        finish(true, { rhythm: r.label });
      } else {
        tile.dataset.resolved = '1';
        tile.style.borderColor = 'var(--red)';
        flashResult(false);
        misses++;
        setLives(maxMisses, maxMisses-misses);
        if(misses >= maxMisses) finish(false,{reason:'wrong_rhythm'});
      }
    };
    grid.appendChild(tile);
  });

  startTimer(timeLimit, ()=>finish(false,{reason:'timeout'}));
}

/* =========================================================================
   12) OXYGEN FLOW
   A simulated SpO₂ drifts; use a slider to hold it in the safe 94–98% range.
   ========================================================================= */
function buildOxygenFlow(difficulty, timeLimit){
  const safeMin = 94, safeMax = 98;
  const tolerance = { easy:2, medium:1.5, hard:1 }[difficulty];
  const holdNeeded = { easy:5000, medium:4000, hard:3000 }[difficulty];
  const driftSpeed = { easy:0.015, medium:0.025, hard:0.04 }[difficulty];

  let flow = 50; // slider 0–100 representing L/min mapped to SpO2
  let spo2 = rand(88,92); // starts low
  let holdMs = 0;

  const wrap = document.createElement('div');
  wrap.className = 'o2-wrap';
  wrap.innerHTML = `
    <div class="o2-readout" id="o2Val">${spo2.toFixed(1)}</div>
    <div class="o2-unit">${t('oxygenflow.readout_unit')}</div>
    <div class="o2-zone-label">${t('oxygenflow.safe_zone')}</div>
    <div class="o2-lock"><div class="o2-lock-fill" id="o2LockFill"></div></div>
    <input type="range" min="0" max="100" value="${flow}" id="o2Slider" style="width:100%">
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('oxygenflow.hint');
  stage.appendChild(hint);

  const valEl = wrap.querySelector('#o2Val');
  const lockFill = wrap.querySelector('#o2LockFill');
  const slider = wrap.querySelector('#o2Slider');
  slider.addEventListener('input', ()=>{ flow = +slider.value; });

  // flow 0 → SpO2 drops; flow 50 = neutral; flow 100 → SpO2 rises
  // target is to hold 94–98%
  let raf, last = Date.now();
  function loop(){
    const now = Date.now(), dt = now-last; last = now;
    const influence = (flow - 50) / 50; // -1 to +1
    spo2 += influence * driftSpeed * dt - driftSpeed * 0.3 * dt; // always slight downward drift
    spo2 = clamp(spo2, 60, 100);

    valEl.textContent = spo2.toFixed(1);
    const inRange = spo2 >= safeMin-tolerance && spo2 <= safeMax+tolerance;
    wrap.classList.toggle('o2-danger', !inRange);
    if(inRange){
      holdMs += dt;
      lockFill.style.width = clamp((holdMs/holdNeeded)*100,0,100)+'%';
      if(holdMs >= holdNeeded){ finish(true,{spo2:spo2.toFixed(1), holdMs}); return; }
    } else {
      holdMs = Math.max(0, holdMs-dt*1.5);
      lockFill.style.width = clamp((holdMs/holdNeeded)*100,0,100)+'%';
    }
    raf = requestAnimationFrame(loop);
  }
  loop();
  current.cleanup = ()=>{ cancelAnimationFrame(raf); };
  startTimer(timeLimit, ()=>finish(false,{reason:'timeout'}));
}

/* =========================================================================
   13) DRUG INTERACTION
   Current medication shown; pick the dangerous interacting drug from 4 opts.
   ========================================================================= */
function buildDrugInteract(difficulty, timeLimit){
  const maxMisses = { easy:3, medium:2, hard:1 }[difficulty];
  let misses = 0;
  setLives(maxMisses, maxMisses-misses);

  const cases = t('druginteract.cases');
  const c = pick(cases);
  const options = shuffle(c.options);

  const wrap = document.createElement('div');
  wrap.className = 'drug-wrap';
  wrap.innerHTML = `
    <div class="drug-current">Patient is currently taking: <span>${c.current}</span></div>
    <div class="drug-options" id="drugOpts"></div>
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('druginteract.hint');
  stage.appendChild(hint);

  const optsEl = wrap.querySelector('#drugOpts');
  options.forEach(drug => {
    const btn = document.createElement('div');
    btn.className = 'drug-opt';
    btn.textContent = drug;
    btn.onclick = () => {
      if(btn.dataset.resolved) return;
      if(drug === c.bad){
        finish(true,{drug, reason:c.reason});
      } else {
        btn.dataset.resolved = '1';
        btn.classList.add('miss-flash');
        flashResult(false);
        misses++;
        setLives(maxMisses, maxMisses-misses);
        setTimeout(()=>btn.classList.remove('miss-flash'),300);
        if(misses >= maxMisses) finish(false,{reason:'wrong_drug'});
      }
    };
    optsEl.appendChild(btn);
  });

  startTimer(timeLimit, ()=>finish(false,{reason:'timeout'}));
}

/* =========================================================================
   14) SCENE SAFETY
   Incident report text; click every embedded hazard word/phrase.
   ========================================================================= */
function buildSceneSafety(difficulty, timeLimit){
  const hazardPool = t('scenesafety.hazards');
  const wordBank = t('scenesafety.word_bank').split(' ');
  const hazardCount = { easy:2, medium:3, hard:4 }[difficulty];
  const maxMisses = { easy:5, medium:4, hard:3 }[difficulty];
  let misses = 0, foundCount = 0;
  setLives(maxMisses, maxMisses-misses);

  const chosenHazards = shuffle(hazardPool).slice(0, hazardCount);
  const totalWords = { easy:70, medium:90, hard:110 }[difficulty];
  const words = Array.from({length:totalWords}, ()=>pick(wordBank));

  // inject hazards as single tokens
  const slots = shuffle(Array.from({length:totalWords},(_,i)=>i)).slice(0, hazardCount);
  slots.forEach((slot, i)=>{ words[slot] = chosenHazards[i]; });

  const wrap = document.createElement('div');
  wrap.className = 'scene-wrap';
  wrap.innerHTML = `<div class="scene-target">${t('scenesafety.target_label')} <span>${chosenHazards.map(h=>h.toUpperCase()).join(', ')}</span></div>
    <div class="scene-doc" id="doc"></div>`;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('scenesafety.hint',{count:hazardCount});
  stage.appendChild(hint);

  const docEl = wrap.querySelector('#doc');
  words.forEach((w,i)=>{
    const span = document.createElement('span');
    span.className = 'scene-word';
    span.textContent = w;
    span.dataset.isHazard = chosenHazards.includes(w) ? '1' : '0';
    span.dataset.resolved = '0';
    docEl.appendChild(span);
    docEl.appendChild(document.createTextNode(' '));
  });

  docEl.addEventListener('click', e=>{
    const span = e.target.closest('.scene-word');
    if(!span || span.dataset.resolved === '1') return;
    span.dataset.resolved = '1';
    if(span.dataset.isHazard === '1'){
      span.classList.add('found');
      foundCount++;
      flashResult(true);
      if(foundCount >= hazardCount) finish(true,{found:foundCount});
    } else {
      span.classList.add('miss-flash');
      flashResult(false);
      misses++;
      setLives(maxMisses, maxMisses-misses);
      setTimeout(()=>span.classList.remove('miss-flash'),300);
      if(misses >= maxMisses) finish(false,{reason:'too_many_misses'});
    }
  });

  startTimer(timeLimit, ()=>finish(false,{reason:'timeout'}));
}

/* =========================================================================
   15) SPINAL IMMOBILISATION SEQUENCE
   Body zones briefly highlighted in order; repeat the sequence from memory.
   ========================================================================= */
function buildSpinalSeq(difficulty, timeLimit){
  const seqLen = { easy:3, medium:4, hard:5 }[difficulty];
  const previewMs = { easy:700, medium:550, hard:400 }[difficulty]; // ms each zone is lit
  const zones = t('spinalseq.zones'); // 5 named zones
  const sequence = Array.from({length:seqLen}, ()=>randInt(0,zones.length-1));
  let inputIdx = 0;
  const maxMisses = { easy:2, medium:1, hard:0 }[difficulty];
  let misses = 0;
  setLives(maxMisses+1, maxMisses+1-misses);

  // SVG body figure divided into 5 clickable zones stacked vertically
  const zoneH = 36, figW = 60;
  const svgH = zones.length * zoneH;
  const COLORS = ['#4dabf7','#51cf66','#fcc419','#f783ac','#9775fa'];

  const wrap = document.createElement('div');
  wrap.className = 'spinal-wrap';

  // sequence slots display
  const seqDisplay = document.createElement('div');
  seqDisplay.className = 'spinal-sequence';
  for(let i=0;i<seqLen;i++){
    const slot = document.createElement('div');
    slot.className = 'spinal-slot';
    slot.textContent = i+1;
    seqDisplay.appendChild(slot);
  }
  wrap.appendChild(seqDisplay);

  // body SVG
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${figW} ${svgH}`);
  svg.setAttribute('width',figW); svg.setAttribute('height',svgH);
  svg.classList.add('spinal-svg');
  svg.style.display = 'block';
  svg.style.margin = '0 auto 10px';

  const rects = zones.map((z,i)=>{
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x',4); rect.setAttribute('y',i*zoneH+2);
    rect.setAttribute('width',figW-8); rect.setAttribute('height',zoneH-4);
    rect.setAttribute('rx',6);
    rect.setAttribute('fill','#2c2e33');
    rect.setAttribute('stroke','var(--edge)');
    rect.dataset.zone = i;
    rect.classList.add('spinal-zone');
    svg.appendChild(rect);

    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x',figW/2); label.setAttribute('y',i*zoneH+zoneH/2+5);
    label.setAttribute('text-anchor','middle');
    label.setAttribute('fill','var(--muted)');
    label.setAttribute('font-size','9');
    label.setAttribute('font-family','Consolas,monospace');
    label.textContent = z;
    svg.appendChild(label);
    return rect;
  });
  wrap.appendChild(svg);
  stage.appendChild(wrap);

  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('spinalseq.hint');
  stage.appendChild(hint);

  // playback animation
  let accepting = false;
  async function playback(){
    accepting = false;
    for(const zoneIdx of sequence){
      rects[zoneIdx].setAttribute('fill', COLORS[zoneIdx]);
      rects[zoneIdx].setAttribute('stroke', COLORS[zoneIdx]);
      await sleep(previewMs);
      rects[zoneIdx].setAttribute('fill','#2c2e33');
      rects[zoneIdx].setAttribute('stroke','var(--edge)');
      await sleep(120);
    }
    accepting = true;
    hint.textContent = t('spinalseq.hint').replace('Memorize', 'Now click').replace('then click', '—');
  }
  playback();

  svg.addEventListener('click', e=>{
    if(!accepting) return;
    const rect = e.target.closest('.spinal-zone');
    if(!rect) return;
    const clicked = Number(rect.dataset.zone);

    if(clicked === sequence[inputIdx]){
      // correct
      rects[clicked].setAttribute('fill', COLORS[clicked]);
      rects[clicked].setAttribute('stroke', COLORS[clicked]);
      seqDisplay.children[inputIdx].classList.add('filled');
      seqDisplay.children[inputIdx].textContent = zones[clicked].slice(0,3);
      inputIdx++;
      flashResult(true);
      setTimeout(()=>{
        rects[clicked].setAttribute('fill','#2c2e33');
        rects[clicked].setAttribute('stroke','var(--edge)');
      }, 250);
      if(inputIdx >= seqLen){ finish(true,{sequence:sequence.map(i=>zones[i])}); }
    } else {
      flashResult(false);
      misses++;
      setLives(maxMisses+1, maxMisses+1-misses);
      if(misses > maxMisses){ finish(false,{reason:'wrong_zone',progress:inputIdx}); return; }
      // restart input on mistake
      inputIdx = 0;
      seqDisplay.querySelectorAll('.spinal-slot').forEach((s,i)=>{
        s.classList.remove('filled'); s.textContent = i+1;
      });
    }
  });

  startTimer(timeLimit, ()=>finish(false,{reason:'timeout'}));
}
