<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SRM Minigames - Live demo</title>
<style>
/* =========================================================================
   srm-minigames - ox_lib inspired theme (Mantine dark palette)
   Tokens first; every component below only uses these variables.
   ========================================================================= */
:root{
  --panel:#1a1b1e;          /* modal background            */
  --input:#25262b;          /* input / card surface        */
  --input-hover:#2c2e33;
  --edge:#373a40;           /* borders                     */
  --text:#c1c2c5;
  --white:#ffffff;
  --muted:#909296;          /* descriptions                */
  --dim:#5c5f66;
  --blue:#228be6;           /* primary accent              */
  --cyan:#4dabf7;           /* primary accent, light       */
  --blue-soft:rgba(34,139,230,.22);
  --green:#51cf66;
  --lime:#94d82d;
  --amber:#fcc419;
  --red:#fa5252;
  --sans:Roboto,'Segoe UI',Arial,sans-serif;
  --radius:4px;
}

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ width:100%; height:100%; background:transparent; overflow:hidden; font-family:var(--sans); }

#app{
  position:fixed; top:0; left:0; right:0; bottom:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--sans); color:var(--text);
}
#app.hidden{ display:none; }

/* ------------------------------ dialog frame ------------------------------ */
.frame{
  width:560px; background:var(--panel); border-radius:var(--radius);
  box-shadow:0 6px 28px rgba(0,0,0,.55); overflow:hidden;
  animation:pop .16s ease-out;
}
@keyframes pop{ from{ opacity:0; transform:scale(.97); } to{ opacity:1; transform:scale(1); } }

.frame__topline{ position:relative; display:flex; align-items:center; justify-content:center; padding:18px 64px 12px; }
.frame__title{ font-size:18px; font-weight:500; color:var(--text); text-align:center; }
.frame__clock{ position:absolute; right:16px; top:20px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }

.frame__timerbar{ height:4px; margin:0 16px; background:var(--input); border-radius:2px; overflow:hidden; }
.frame__timerfill{ height:100%; width:100%; background:var(--blue); border-radius:2px; transition:width .1s linear; }
.frame__timerfill.danger{ background:var(--red); }

.stage{
  position:relative; padding:18px 20px 14px; min-height:240px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
}

.frame__footline{ display:flex; align-items:center; justify-content:space-between; padding:10px 16px 16px; }
#hintText{ font-size:12px; color:var(--dim); }
.frame__actions{ display:flex; align-items:center; gap:14px; }
.lives{ display:flex; gap:5px; }
.life-pip{ width:8px; height:8px; border-radius:50%; background:var(--dim); }
.life-pip.on{ background:var(--cyan); }
.life-pip.off{ background:var(--edge); }

.flash-ok{ animation:flashOk .35s ease; }
.flash-bad{ animation:flashBad .35s ease; }
@keyframes flashOk{ 0%{ box-shadow:inset 0 0 0 999px rgba(81,207,102,.14); } 100%{ box-shadow:none; } }
@keyframes flashBad{ 0%{ box-shadow:inset 0 0 0 999px rgba(250,82,82,.16); } 100%{ box-shadow:none; } }

/* ------------------------------ shared widgets ----------------------------- */
.hint{ font-size:12px; color:var(--muted); text-align:center; margin-top:2px; max-width:480px; }
.section-label{ font-size:14px; font-weight:700; color:var(--white); letter-spacing:.2px; text-transform:uppercase; }

.btn{
  font-family:var(--sans); font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.2px;
  color:var(--white); background:var(--input); border:1px solid var(--edge); border-radius:var(--radius);
  height:36px; padding:0 18px; cursor:pointer; transition:background .12s, border-color .12s;
}
.btn:hover{ background:var(--input-hover); }
.btn:active{ transform:translateY(1px); }
.btn:disabled{ opacity:.45; cursor:default; }
.btn.primary{ background:var(--blue-soft); border-color:transparent; color:var(--cyan); }
.btn.primary:hover{ background:rgba(34,139,230,.34); }

/* "input surface": every box that looks like an ox_lib input */
.card-item,.contra-item,.interro-btn,.drug-opt,.dosage-opt,.airway-step,.evi-card,.vital-card,
.fp-tile,.mem-tile,.ecg-tile,.triage-patient,.redact-doc,.scene-doc,.dosage-brief,.drug-current,
.contra-fact,.phist-fact,.interro-intro,.sobriety-svg,.iv-svg,.tri-svg,.spotdiff-photo,
.bar-track,.defib-gauge,.tune-meter,.code-slot{
  background:var(--input); border:1px solid var(--edge); border-radius:var(--radius); color:var(--white);
}
/* clickable ones get the ox_lib blue focus border on hover */
.card-item:hover,.contra-item:hover,.interro-btn:hover,.drug-opt:hover,.dosage-opt:hover,.evi-card:hover,
.vital-card:hover,.fp-tile:hover,.mem-tile:hover,.ecg-tile:hover{ border-color:var(--blue); }
.card-item.miss-flash,.contra-item.miss-flash,.drug-opt.miss-flash,.dosage-opt.miss-flash,.evi-card.miss-flash,
.vital-card.miss-flash{ border-color:var(--red); box-shadow:0 0 0 1px var(--red); }

/* ------------------------------- lockpick ---------------------------------- */
.lock-wrap{ position:relative; width:220px; height:220px; }
.lock-svg{ position:absolute; top:0; left:0; width:220px; height:220px; }

/* ----------------------- skill bar (police + wound dressing) --------------- */
.bar-wrap{ width:440px; }
.bar-track{ position:relative; height:28px; overflow:hidden; }
.bar-zone{ position:absolute; top:0; bottom:0; background:rgba(34,139,230,.30); border-left:2px solid var(--cyan); border-right:2px solid var(--cyan); }
.bar-marker{ position:absolute; top:-3px; bottom:-3px; width:4px; background:var(--white); border-radius:2px; box-shadow:0 0 6px rgba(255,255,255,.6); }
.bar-progress{ display:flex; gap:6px; margin-top:14px; justify-content:center; }
.bar-pip{ width:36px; height:6px; border-radius:3px; background:var(--edge); }
.bar-pip.done{ background:var(--green); }

/* --------------------------- hacking (simon says) -------------------------- */
.simon-grid{ display:grid; grid-template-columns:repeat(2,90px); gap:10px; }
.simon-btn{ width:90px; height:90px; border-radius:var(--radius); border:1px solid var(--edge); cursor:pointer; opacity:.55; transition:.1s; }
.simon-btn.lit{ opacity:1; filter:brightness(1.5); box-shadow:0 0 18px currentColor; }
.simon-btn.c0{ background:#1c7ed6; color:#1c7ed6; }
.simon-btn.c1{ background:#37b24d; color:#37b24d; }
.simon-btn.c2{ background:#f76707; color:#f76707; }
.simon-btn.c3{ background:#ae3ec9; color:#ae3ec9; }

/* -------------------------------- wire cut --------------------------------- */
.wire-grid{ display:grid; gap:10px; }
.wire{ width:54px; height:54px; border-radius:var(--radius); cursor:pointer; border:1px solid var(--edge); transition:.1s; }
.wire:hover{ transform:translateY(-2px); }

/* ------------------------------- code breaker ------------------------------ */
.code-wrap{ width:380px; }
.code-row{ display:flex; gap:8px; align-items:center; margin-bottom:6px; }
.code-slot{ width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:var(--cyan); font-size:16px; font-weight:700; }
.code-feedback{ display:flex; gap:4px; margin-left:8px; }
.peg{ width:10px; height:10px; border-radius:50%; }
.peg.green{ background:var(--green); }
.peg.yellow{ background:var(--amber); }
.keypad{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:14px; }
.history{ max-height:140px; overflow-y:auto; margin-bottom:10px; }

/* -------------------------------- fingerprint ------------------------------ */
.fp-target{ width:90px; height:90px; margin:0 auto 14px; border:1px solid var(--blue); border-radius:var(--radius); background:var(--input); }
.fp-grid{ display:grid; grid-template-columns:repeat(3,70px); gap:10px; }
.fp-tile{ width:70px; height:70px; cursor:pointer; }

/* -------------------------------- radio tuning ----------------------------- */
.tune-wrap{ width:380px; text-align:center; }
.tune-readout{ font-size:32px; font-weight:500; color:var(--cyan); letter-spacing:1px; margin-bottom:6px; font-variant-numeric:tabular-nums; }
.tune-target{ color:var(--amber); font-size:13px; font-weight:700; margin-bottom:14px; }
.tune-meter{ height:10px; overflow:hidden; margin-bottom:14px; }
.tune-meter-fill{ height:100%; background:linear-gradient(90deg,var(--red),var(--amber),var(--green)); width:0%; }
.tune-slider{ width:100%; accent-color:var(--blue); }

/* ---------------------------------- reaction ------------------------------- */
.reaction-wrap{ text-align:center; }
.reaction-key{
  width:90px; height:90px; border:2px solid var(--blue); border-radius:var(--radius); background:var(--input);
  display:flex; align-items:center; justify-content:center; font-size:42px; color:var(--cyan); margin:0 auto 16px;
}
.reaction-progress{ display:flex; gap:6px; justify-content:center; }

/* ---------------------------------- sobriety ------------------------------- */
.sobriety-wrap{ width:480px; }
.sobriety-svg{ width:100%; height:180px; }

/* ------------------------------- evidence board ---------------------------- */
.evi-grid{ display:grid; gap:10px; width:480px; }
.evi-card{ padding:12px 10px; font-size:13px; cursor:pointer; text-align:center; transition:.12s; min-height:52px; display:flex; align-items:center; justify-content:center; }
.evi-card.selected{ border-color:var(--cyan); background:var(--blue-soft); }
.evi-card.matched{ border-color:var(--green); color:var(--green); opacity:.55; cursor:default; }

/* ----------------- contradiction / patient history (fact + list) ------------ */
.contra-wrap{ width:480px; }
.contra-fact,.phist-fact{ font-size:13px; font-weight:500; color:var(--amber); padding:10px 12px; margin-bottom:14px; width:480px; }
.contra-fact{ width:auto; }
.contra-list,.card-list{ display:flex; flex-direction:column; gap:8px; width:480px; }
.contra-item,.card-item{ padding:10px 12px; font-size:13px; cursor:pointer; transition:.12s; }

/* -------------------------------- surveillance ----------------------------- */
.surv-wrap{ width:420px; text-align:center; }
.surv-readout{ font-size:13px; font-weight:500; color:var(--cyan); margin-bottom:14px; min-height:18px; }
.surv-slider{ width:100%; margin-bottom:10px; accent-color:var(--blue); }

/* ------------------------------ spot the difference ------------------------ */
.spotdiff-wrap{ display:flex; gap:18px; }
.spotdiff-col{ text-align:center; }
.spotdiff-label{ font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.4px; margin-bottom:6px; }
.diff-shape{ cursor:pointer; }

/* ---------------------- redaction / scene safety (word hunt) --------------- */
.redact-wrap,.scene-wrap{ width:480px; }
.redact-target,.scene-target{ font-size:13px; font-weight:700; color:var(--white); margin-bottom:10px; }
.redact-key,.scene-target span{ color:var(--amber); }
.redact-doc,.scene-doc{ font-size:13px; line-height:1.9; max-height:200px; overflow-y:auto; padding:10px 12px; color:var(--text); }
.redact-word,.scene-word{ cursor:pointer; padding:1px 2px; border-radius:3px; }
.redact-word:hover,.scene-word:hover{ background:rgba(77,171,247,.18); }
.redact-word.found,.scene-word.found{ background:rgba(81,207,102,.25); color:var(--green); text-decoration:line-through; }
.redact-word.miss-flash,.scene-word.miss-flash{ background:rgba(250,82,82,.30); }

/* -------------------------------- interrogation ---------------------------- */
.interro-wrap{ width:480px; }
.interro-intro{ font-size:12px; color:var(--muted); padding:8px 12px; margin-bottom:12px; }
.interro-prompt{ font-size:14px; font-weight:700; color:var(--white); margin-bottom:10px; }
.interro-options{ display:flex; flex-direction:column; gap:8px; }
.interro-btn{ font-family:var(--sans); text-align:left; padding:10px 12px; cursor:pointer; font-size:13px; transition:.12s; }
.interro-btn.good-flash{ border-color:var(--green); box-shadow:0 0 0 1px var(--green); }
.interro-btn.bad-flash{ border-color:var(--red); box-shadow:0 0 0 1px var(--red); }

/* -------------------------------- triangulation ---------------------------- */
.tri-wrap{ text-align:center; }
.tri-readout{ font-size:12px; color:var(--muted); margin-bottom:10px; line-height:1.6; }
.tri-cell{ cursor:pointer; transition:.1s; }
.tri-cell:hover{ fill:rgba(77,171,247,.22) !important; }

/* -------------------------------- memory search ---------------------------- */
.mem-grid{ display:grid; gap:8px; }
.mem-tile{ width:56px; height:56px; display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer; transition:.12s; }
.mem-tile.revealed{ background:var(--input-hover); border-color:var(--cyan); }
.mem-tile.found-correct{ border-color:var(--green); color:var(--green); background:rgba(81,207,102,.15); cursor:default; }
.mem-tile.found-wrong{ border-color:var(--red); background:rgba(250,82,82,.18); cursor:default; }

/* ------------------------------------ CPR ---------------------------------- */
.cpr-wrap{ text-align:center; width:440px; }
.cpr-bpm{ font-size:48px; font-weight:500; color:var(--white); margin-bottom:4px; font-variant-numeric:tabular-nums; }
.cpr-target{ font-size:12px; color:var(--muted); margin-bottom:14px; }
.cpr-beat{ width:60px; height:60px; border-radius:50%; border:3px solid var(--blue); margin:0 auto 14px; transition:transform .05s, box-shadow .05s; }
.cpr-beat.pulse{ transform:scale(1.18); box-shadow:0 0 16px var(--blue); background:var(--blue-soft); }
.cpr-history{ display:flex; gap:4px; justify-content:center; margin-top:8px; }
.cpr-pip{ width:8px; height:8px; border-radius:50%; background:var(--edge); }
.cpr-pip.ok{ background:var(--green); }
.cpr-pip.miss{ background:var(--red); }

/* ---------------------------------- defib ---------------------------------- */
.defib-wrap{ text-align:center; width:440px; }
.defib-gauge{ position:relative; height:30px; overflow:hidden; margin-bottom:10px; }
.defib-fill{ height:100%; background:linear-gradient(90deg,var(--green),var(--lime),var(--amber),var(--red)); width:0%; opacity:.9; }
.defib-zone{ position:absolute; top:0; bottom:0; background:rgba(255,255,255,.14); border-left:2px solid var(--white); border-right:2px solid var(--white); }
.defib-readout{ font-size:32px; font-weight:500; color:var(--amber); margin-bottom:6px; font-variant-numeric:tabular-nums; }
.defib-label{ font-size:12px; color:var(--muted); margin-bottom:12px; }

/* --------------------------------- vitals ---------------------------------- */
.vitals-wrap{ width:480px; }
.vitals-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.vital-card{ padding:12px; cursor:pointer; transition:.12s; }
.vital-name{ font-size:12px; font-weight:700; color:var(--muted); margin-bottom:4px; }
.vital-value{ font-size:22px; font-weight:500; color:var(--white); font-variant-numeric:tabular-nums; }
.vital-unit{ font-size:12px; color:var(--muted); }

/* ---------------------------------- IV line -------------------------------- */
.iv-wrap{ width:480px; }

/* --------------------------------- dosage ---------------------------------- */
.dosage-wrap{ width:480px; }
.dosage-brief{ padding:12px; margin-bottom:12px; font-size:13px; line-height:1.7; color:var(--text); }
.dosage-brief strong{ color:var(--white); }
.dosage-formula{ color:var(--muted); font-size:12px; margin-bottom:12px; }
.dosage-options{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.dosage-opt{ padding:10px; cursor:pointer; text-align:center; font-size:16px; font-weight:500; transition:.12s; }

/* --------------------------------- airway ---------------------------------- */
.airway-wrap{ width:480px; }
.airway-steps{ display:flex; flex-direction:column; gap:8px; }
.airway-step{ display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:grab; font-size:13px; user-select:none; }
.airway-step.dragging{ opacity:.5; cursor:grabbing; }
.airway-step .step-num{ color:var(--cyan); min-width:20px; font-size:14px; font-weight:700; }
.airway-confirm{ margin-top:4px; }

/* --------------------------------- triage ---------------------------------- */
.triage-wrap{ width:480px; }
.triage-patient{ padding:12px; font-size:13px; line-height:1.5; }
.triage-btns{ display:flex; gap:8px; margin-top:10px; }
.triage-btn{ font-family:var(--sans); font-size:12px; font-weight:700; padding:0 14px; height:32px; border-radius:var(--radius); cursor:pointer; border:1px solid var(--edge); background:var(--input); color:var(--white); transition:.12s; }
.triage-btn:hover{ background:var(--input-hover); }
.triage-btn:disabled{ opacity:.4; cursor:default; }
.triage-btn.t-immediate{ border-color:rgba(250,82,82,.6); color:var(--red); }
.triage-btn.t-delayed{ border-color:rgba(252,196,25,.6); color:var(--amber); }
.triage-btn.t-minor{ border-color:rgba(81,207,102,.6); color:var(--green); }

/* ------------------------------- blood pressure ---------------------------- */
.bp-wrap{ width:440px; text-align:center; }
.bp-readout{ font-size:36px; font-weight:500; color:var(--white); margin-bottom:4px; font-variant-numeric:tabular-nums; }
.bp-target{ font-size:13px; font-weight:700; color:var(--amber); margin-bottom:14px; }
.bp-sliders{ display:flex; flex-direction:column; gap:8px; }
.bp-row{ display:flex; align-items:center; gap:10px; font-size:12px; }
.bp-row label{ width:84px; text-align:right; color:var(--muted); font-weight:700; }
.bp-row input{ flex:1; accent-color:var(--blue); }
.bp-lock,.o2-lock{ height:6px; background:var(--input); border-radius:3px; margin-top:10px; overflow:hidden; }
.bp-lock-fill{ height:100%; background:var(--green); width:0%; transition:width .1s; }

/* ----------------------------------- ECG ----------------------------------- */
.ecg-wrap{ width:480px; text-align:center; }
.ecg-label{ font-size:12px; color:var(--muted); margin-bottom:6px; }
.ecg-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.ecg-tile{ cursor:pointer; padding:4px; }

/* ------------------------------- oxygen flow ------------------------------- */
.o2-wrap{ width:440px; text-align:center; }
.o2-readout{ font-size:42px; font-weight:500; color:var(--cyan); margin-bottom:2px; font-variant-numeric:tabular-nums; }
.o2-unit{ font-size:13px; color:var(--muted); margin-bottom:8px; }
.o2-zone-label{ font-size:12px; font-weight:700; color:var(--green); margin-bottom:10px; }
.o2-lock{ height:8px; margin:0 0 14px; }
.o2-lock-fill{ height:100%; background:var(--green); width:0%; }
.o2-wrap input[type=range]{ accent-color:var(--blue); }
.o2-danger .o2-readout{ color:var(--red); }
.o2-danger .o2-lock-fill{ background:var(--red); }

/* ----------------------------- drug interaction ---------------------------- */
.drug-wrap{ width:480px; }
.drug-current{ padding:10px 12px; margin-bottom:12px; font-size:13px; }
.drug-current span{ color:var(--amber); font-weight:700; }
.drug-options{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.drug-opt{ padding:10px 12px; cursor:pointer; font-size:14px; text-align:center; transition:.12s; }

/* ------------------------------- spinal sequence --------------------------- */
.spinal-wrap{ width:480px; text-align:center; }
.spinal-svg{ width:60px; }
.spinal-zone{ cursor:pointer; transition:.1s; }
.spinal-zone:hover{ opacity:.8; }
.spinal-sequence{ display:flex; gap:6px; justify-content:center; margin-bottom:10px; flex-wrap:wrap; }
.spinal-slot{ width:38px; height:36px; background:var(--input); border:1px solid var(--edge); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--muted); }
.spinal-slot.filled{ border-color:var(--green); color:var(--green); }

</style>
<style>
  html,body{ overflow:auto; }
  body{ background:#141517; color:var(--text); font-family:var(--sans); }
  #panel{
    position:fixed; top:0; left:0; bottom:0; width:300px; overflow-y:auto;
    background:var(--panel); border-right:1px solid var(--edge); padding:18px 16px;
  }
  #panel h2{ font-size:18px; font-weight:500; text-align:center; margin-bottom:4px; }
  #panel .sub{ font-size:12px; color:var(--muted); text-align:center; margin-bottom:16px; }
  .field-label{ font-size:14px; font-weight:700; color:var(--white); margin:10px 0 4px; }
  select{
    width:100%; height:36px; padding:0 10px; background:var(--input); color:var(--white);
    border:1px solid var(--edge); border-radius:var(--radius); font-family:var(--sans); font-size:14px;
  }
  select:focus{ outline:none; border-color:var(--blue); }
  .group{ font-size:12px; font-weight:700; letter-spacing:.5px; color:var(--muted); text-transform:uppercase; margin:18px 0 6px; }
  .game-btn{
    display:block; width:100%; text-align:left; margin-bottom:5px; height:34px; padding:0 12px;
    background:var(--input); border:1px solid var(--edge); border-radius:var(--radius);
    color:var(--white); font-family:var(--sans); font-size:13px; cursor:pointer;
  }
  .game-btn:hover{ border-color:var(--blue); }
  #log{ margin-top:16px; border-top:1px solid var(--edge); padding-top:10px; font-size:12px; color:var(--muted); max-height:240px; overflow-y:auto; }
  #log div{ margin-bottom:6px; word-break:break-word; }
  #log .ok{ color:var(--green); }
  #log .bad{ color:var(--red); }
  #stageWrap{ margin-left:300px; height:100vh; position:relative; }
  #stageWrap #app{ position:absolute; }
  :root{ color-scheme: dark; }
  *{
    scrollbar-width: thin;
    scrollbar-color: #3a3a3c transparent;
  }
  @supports not (scrollbar-color: auto) {
    *::-webkit-scrollbar{ width:8px; height:8px; }
    *::-webkit-scrollbar-track{ background:transparent; }
    *::-webkit-scrollbar-thumb{ background:#3a3a3c; border-radius:4px; }
    *::-webkit-scrollbar-thumb:hover{ background:#2f6bff; }
    *::-webkit-scrollbar-button{ display:none; }
  }
</style>
</head>
<body>

<div id="panel">
  <h2>SRM Minigames</h2>
  <div class="sub">Preview of the minigames pack</div>

  <div class="field-label">Difficulty</div>
  <select id="difficulty">
    <option value="easy">Easy</option>
    <option value="medium" selected>Medium</option>
    <option value="hard">Hard</option>
  </select>

  <div class="field-label">Language</div>
  <select id="locale">
    <option value="en" selected>English</option>
    <option value="nl">Nederlands</option>
  </select>

  <div id="games"></div>
  <div id="log"></div>
</div>

<div id="stageWrap">
  <div id="app" class="hidden">
    <div class="frame">
      <div class="frame__topline">
        <span class="frame__title" id="gameLabel">STANDBY</span>
        <span class="frame__clock" id="gameClock">00:00</span>

  window.GetParentResourceName = () => 'srm-minigames';

  const GAMES = {
    'Police': [
      ['lockpick','Lockpick'],['hacking','Hacking'],['wirecut','Wire Cut'],['skillbar','Skill Bar'],
      ['codebreaker','Code Breaker'],['fingerprint','Fingerprint Match'],['radiotuning','Radio Tuning'],
      ['reaction','Foot Pursuit Reaction'],['sobriety','Sobriety Test'],['evidenceboard','Evidence Board'],
      ['contradiction','Witness Statement Review'],['surveillance','Surveillance Footage'],['spotdiff','Photo Comparison'],
      ['redaction','Document Review'],['interrogation','Suspect Interrogation'],['triangulation','Signal Triangulation'],
      ['memorysearch','Property Search']
    ],
    'Ambulance': [
      ['cpr','CPR'],['defib','Defibrillator'],['vitals','Vitals Assessment'],['ivline','IV Line'],
      ['dosage','Medication Dosage'],['airway','Airway Sequence'],['triage','Triage'],['wounddress','Wound Dressing'],
      ['bloodpressure','Blood Pressure'],['patienthistory','Patient History'],['ecgreading','ECG Reading'],
      ['oxygenflow','Oxygen Flow'],['druginteract','Drug Interaction'],['scenesafety','Scene Safety'],
      ['spinalseq','Spinal Immobilisation']
    ]
  };

  const gamesEl = document.getElementById('games');
  Object.entries(GAMES).forEach(([group, list]) => {
    const h = document.createElement('div'); h.className = 'group'; h.textContent = `${group} (${list.length})`;
    gamesEl.appendChild(h);
    list.forEach(([key, name]) => {
      const b = document.createElement('button');
      b.className = 'game-btn'; b.textContent = name;
      b.onclick = () => window.postMessage({
        action: 'openMinigame',
        payload: { game: key, difficulty: document.getElementById('difficulty').value, locale: document.getElementById('locale').value }
      }, '*');
      gamesEl.appendChild(b);
    });
  });

  const log = document.getElementById('log');
  function addLog(label, data, ok) {
    const div = document.createElement('div');
    div.className = ok === true ? 'ok' : ok === false ? 'bad' : '';
    div.textContent = `[${new Date().toLocaleTimeString()}] ${label} ${JSON.stringify(data)}`;
    log.prepend(div);
  }
  const realFetch = window.fetch.bind(window);
  window.fetch = (url, opts) => {
    if (typeof url === 'string' && url.includes('srm-minigames')) {
      const body = opts && opts.body ? JSON.parse(opts.body) : {};
      const name = url.split('/').pop();
      if (name === 'minigameResult') addLog(`${body.game} ->`, body.data, body.success);
      else if (name === 'minigameCancelled') addLog(`${body.game} -> cancelled`, {}, false);
      return Promise.resolve(new Response('ok'));
    }
    return realFetch(url, opts);
  };
</script>

/* ------------------------------- helpers -------------------------------- */
function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
function rand(a, b){ return Math.random() * (b - a) + a; }
function randInt(a, b){ return Math.floor(rand(a, b + 1)); }
function pick(arr){ return arr[randInt(0, arr.length - 1)]; }
function shuffle(arr){ const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = randInt(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sleep(ms){ return new Promise((res) => setTimeout(res, ms)); }

/* ----------------------------------- i18n ------------------------------------
   Strings live in html/locales/<code>.json.
   Lookup order for each key: active locale -> English -> the key itself.
   (window.__LOCALE_BUNDLE__ is only injected by dev/preview.html so the preview
   works from file://; it is never present in-game.)
   ----------------------------------------------------------------------- */
const BUNDLE = window.__LOCALE_BUNDLE__ || {};
let LOCALE = BUNDLE.en || {};
let localeReady = Promise.resolve();

function deepMerge(base, extra) {
  if (typeof extra !== 'object' || extra === null) return base;
  const out = Array.isArray(base) ? [...base] : { ...base };
  for (const key of Object.keys(extra)) {
    if (extra[key] && typeof extra[key] === 'object' && !Array.isArray(extra[key]) &&
        base[key] && typeof base[key] === 'object' && !Array.isArray(base[key])) {
      out[key] = deepMerge(base[key], extra[key]);
    } else {
      out[key] = extra[key];
    }
  }
  return out;
}

function loadLocale(code) {
  code = code || 'en';
  const request = (typeof fetch === 'function')
    ? fetch(`locales/${code}.json`).then((r) => { if (!r.ok) throw new Error('locale ' + code); return r.json(); })
    : Promise.reject(new Error('no fetch'));
  localeReady = request
    .catch(() => BUNDLE[code] || BUNDLE.en || {})
    .then((data) => { LOCALE = deepMerge(BUNDLE.en || {}, data); });
  return localeReady;
}

function t(path, vars) {
  const lookupIn = (table) => path.split('.').reduce((acc, k) => (acc && acc[k] !== undefined ? acc[k] : undefined), table);
  let str = lookupIn(LOCALE);
  if (str === undefined) str = lookupIn(BUNDLE.en || {});
  if (str === undefined) return path;
  if (typeof str === 'string' && vars) {
    Object.keys(vars).forEach((k) => { str = str.replace(new RegExp(`{{${k}}}`, 'g'), vars[k]); });
  }
  return str;
}
function tLabel(game) { return (LOCALE.labels && LOCALE.labels[game]) || game; }

/* ----------------------------- NUI plumbing ----------------------------- */
// Capture FiveM's native function BEFORE anything can shadow it.
const NATIVE_RESOURCE_NAME = window.GetParentResourceName;
function resourceName() {
  try { return typeof NATIVE_RESOURCE_NAME === 'function' ? NATIVE_RESOURCE_NAME() : 'srm-minigames'; }
  catch (e) { return 'srm-minigames'; }
}

function postNui(name, data) {
  fetch(`https://${resourceName()}/${name}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json; charset=UTF-8' },
    body: JSON.stringify(data || {})
  }).catch(() => {});
}

window.addEventListener('message', (event) => {
  const msg = event.data || {};
  if (msg.action === 'openMinigame') openMinigame(msg.payload);
  else if (msg.action === 'closeMinigame') teardown();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cancelCurrent(); });
cancelBtn.addEventListener('click', () => cancelCurrent());

function cancelCurrent() {
  if (!current) return;
  postNui('minigameCancelled', { game: current.game });
  teardown();
}

function finish(success, data) {
  if (!current) return;
  flashResult(success);
  const game = current.game;
  postNui('minigameResult', { game, success, data: data || {} });
  teardown();
}

function flashResult(ok) {
  stage.classList.remove('flash-ok', 'flash-bad');
  void stage.offsetWidth; // restart the animation on rapid repeats
  stage.classList.add(ok ? 'flash-ok' : 'flash-bad');
}

function teardown() {
  if (current && current.cleanup) current.cleanup();
  if (current && current.timerHandle) clearInterval(current.timerHandle);
  current = null;
  stage.innerHTML = '';
  app.classList.add('hidden');
}

function setLives(total, remaining) {
  livesText.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const pip = document.createElement('span');
    pip.className = 'life-pip ' + (i < remaining ? 'on' : 'off');
    livesText.appendChild(pip);
  }
}

function startTimer(durationMs, onExpire) {
  const start = Date.now();
  const tick = () => {
    const remaining = Math.max(0, durationMs - (Date.now() - start));
    const pct = (remaining / durationMs) * 100;
    timerFill.style.width = pct + '%';
    timerFill.classList.toggle('danger', pct < 25);
    const secs = Math.ceil(remaining / 1000);
    gameClock.textContent = `00:${secs.toString().padStart(2, '0')}`;
    if (remaining <= 0) { clearInterval(current.timerHandle); onExpire(); }
  };
  tick();
  current.timerHandle = setInterval(tick, 100);
}

/* ------------------------------ entry point ------------------------------ */
function openMinigame(payload) {
  teardown();
  app.classList.remove('hidden');
  stage.innerHTML = '';
  timerFill.classList.remove('danger');
  timerFill.style.width = '100%';
  livesText.innerHTML = '';

  const game = payload.game;
  const difficulty = payload.difficulty || 'medium';
  const timeLimit = payload.timeLimit || (DEFAULT_TIME[game] ? DEFAULT_TIME[game][difficulty] : 15000);

  current = { game, difficulty, timeLimit, cleanup: null, timerHandle: null };

  const builders = {
    // police
    lockpick: buildLockpick, hacking: buildHacking, wirecut: buildWirecut, skillbar: buildSkillbar,
    codebreaker: buildCodebreaker, fingerprint: buildFingerprint, radiotuning: buildRadioTuning,
    reaction: buildReaction, sobriety: buildSobriety, evidenceboard: buildEvidenceBoard,
    contradiction: buildContradiction, surveillance: buildSurveillance, spotdiff: buildSpotDiff,
    redaction: buildRedaction, interrogation: buildInterrogation, triangulation: buildTriangulation,
    memorysearch: buildMemorySearch,
    // ambulance
    cpr: buildCPR, defib: buildDefib, vitals: buildVitals, ivline: buildIVLine, dosage: buildDosage,
    airway: buildAirway, triage: buildTriage, wounddress: buildWoundDress, bloodpressure: buildBloodPressure,
    patienthistory: buildPatientHistory, ecgreading: buildECGReading, oxygenflow: buildOxygenFlow,
    druginteract: buildDrugInteract, scenesafety: buildSceneSafety, spinalseq: buildSpinalSeq,
  };

  const builder = builders[game];
  if (!builder) { finish(false, { reason: 'no_builder' }); return; }

  // Load the locale first so every t()/tLabel() inside the builder is already localized.
  loadLocale(payload.locale).then(() => {
    if (!current || current.game !== game) return; // a newer minigame opened meanwhile
    hintText.textContent = t('common.esc_to_abort');
    cancelBtn.textContent = t('common.cancel');
    gameLabel.textContent = payload.label || tLabel(game);
    builder(difficulty, timeLimit);
  });
}

</script>
<script>
/* =========================================================================
   srm-minigames - html/js/games-police.js
   Police minigames (17). Each build* function receives (difficulty, timeLimit).
   ========================================================================= */

/* =========================================================================
   1) LOCKPICK - rotating needle, hit the sweet-spot arc
   The needle and the zone are both drawn inside the SAME <svg> using the
   SAME angle->point function, so there is no possibility of the visual
   needle and the hit-test angle drifting out of sync with each other.
   0deg = 12 o'clock, increasing clockwise.
   ========================================================================= */
function buildLockpick(difficulty, timeLimit) {
  const pinsNeeded = { easy: 2, medium: 3, hard: 4 }[difficulty];
  const speed = { easy: 1.4, medium: 2.0, hard: 2.8 }[difficulty]; // degrees per tick
  let hits = 0, misses = 0;
  const maxMisses = 3;
  setLives(maxMisses, maxMisses - misses);

  const cx = 110, cy = 110, zoneR1 = 64, zoneR2 = 100, needleLen = 92;

  const wrap = document.createElement('div');
  wrap.className = 'lock-wrap';
  wrap.innerHTML = `
    <svg class="lock-svg" viewBox="0 0 220 220" preserveAspectRatio="xMidYMid meet">
      <circle cx="${cx}" cy="${cy}" r="106" fill="none" stroke="#373a40" stroke-width="6"/>
      <path id="zoneArc" fill="rgba(81,207,102,0.35)" stroke="#51cf66" stroke-width="2"/>
      <line id="needleLine" x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - needleLen}"
            stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="7" fill="#4dabf7"/>
    </svg>
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('lockpick.hint', { pins: pinsNeeded });
  stage.appendChild(hint);

  const needleLine = wrap.querySelector('#needleLine');
  const arcEl = wrap.querySelector('#zoneArc');

  let angle = 0; // current needle angle, 0 = top, clockwise
  let zoneStart = rand(0, 360);
  let zoneSize = { easy: 50, medium: 36, hard: 26 }[difficulty];

  function toRad(d) { return (d - 90) * Math.PI / 180; }
  function pointAt(r, deg) {
    const a = toRad(deg);
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }

  function drawZone() {
    const [x1, y1] = pointAt(zoneR1, zoneStart);
    const [x2, y2] = pointAt(zoneR1, zoneStart + zoneSize);
    const [x3, y3] = pointAt(zoneR2, zoneStart + zoneSize);
    const [x4, y4] = pointAt(zoneR2, zoneStart);
    arcEl.setAttribute('d', `M ${x1} ${y1} A ${zoneR1} ${zoneR1} 0 0 1 ${x2} ${y2} L ${x3} ${y3} A ${zoneR2} ${zoneR2} 0 0 0 ${x4} ${y4} Z`);
  }

  function newZone() {
    zoneStart = rand(0, 360);
    drawZone();
  }
  drawZone();

  function drawNeedle() {
    const [nx, ny] = pointAt(needleLen, angle);
    needleLine.setAttribute('x2', nx);
    needleLine.setAttribute('y2', ny);
  }

  let raf;
  function loop() {
    angle = (angle + speed) % 360;
    drawNeedle();
    raf = requestAnimationFrame(loop);
  }
  loop();

  function inZone() {
    const diff = ((angle - zoneStart) + 360) % 360;
    return diff <= zoneSize;
  }

  function onKey(e) {
    if (e.code !== 'Space') return;
    e.preventDefault();
    if (inZone()) {
      hits++;
      flashResult(true);
      if (hits >= pinsNeeded) {
        finish(true, { pins: hits });
        return;
      }
      newZone();
    } else {
      misses++;
      flashResult(false);
      setLives(maxMisses, maxMisses - misses);
      if (misses >= maxMisses) {
        finish(false, { reason: 'too_many_misses' });
        return;
      }
    }
  }
  window.addEventListener('keydown', onKey);

  current.cleanup = () => { cancelAnimationFrame(raf); window.removeEventListener('keydown', onKey); };
  startTimer(timeLimit, () => finish(false, { reason: 'timeout' }));
}

/* =========================================================================
   2) HACKING - Simon Says color sequence
   ========================================================================= */
function buildHacking(difficulty, timeLimit) {
  const seqLen = { easy: 4, medium: 6, hard: 8 }[difficulty];
  const colors = ['c0', 'c1', 'c2', 'c3'];
  const sequence = Array.from({ length: seqLen }, () => randInt(0, 3));
  let playerIndex = 0;
  let accepting = false;

  const wrap = document.createElement('div');
  wrap.className = 'simon-grid';
  colors.forEach((c, i) => {
    const btn = document.createElement('div');
    btn.className = 'simon-btn ' + c;
    btn.dataset.i = i;
    wrap.appendChild(btn);
  });
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('hacking.hint');
  stage.appendChild(hint);

  const btns = [...wrap.children];

  function lit(i, on) { btns[i].classList.toggle('lit', on); }

  async function playback() {
    accepting = false;
    hint.textContent = t('hacking.watching');
    await sleep(500);
    for (const i of sequence) {
      lit(i, true);
      await sleep(350);
      lit(i, false);
      await sleep(150);
    }
    hint.textContent = t('hacking.your_turn');
    accepting = true;
  }

  function onClick(e) {
    if (!accepting) return;
    const btn = e.target.closest('.simon-btn');
    if (!btn) return;
    const i = Number(btn.dataset.i);
    lit(i, true);
    setTimeout(() => lit(i, false), 150);

    if (i !== sequence[playerIndex]) {
      finish(false, { reason: 'wrong_sequence', progress: playerIndex });
      return;
    }
    playerIndex++;
    if (playerIndex >= sequence.length) {
      finish(true, { length: sequence.length });
    }
  }
  wrap.addEventListener('click', onClick);
  current.cleanup = () => wrap.removeEventListener('click', onClick);

  playback();
  startTimer(timeLimit, () => finish(false, { reason: 'timeout' }));
}


/* =========================================================================
   3) WIRE CUT - find the odd-colored wire among pairs
   ========================================================================= */
function buildWirecut(difficulty, timeLimit) {
  const gridSize = { easy: 4, medium: 6, hard: 9 }[difficulty]; // must stay odd-friendly
  const palette = ['#e74c3c', '#3498db', '#f1c40f', '#9b59b6', '#1abc9c', '#e67e22', '#ecf0f1', '#f783ac'];

  // build pairs + 1 unique
  const total = gridSize % 2 === 0 ? gridSize + 1 : gridSize;
  const pairCount = (total - 1) / 2;
  const usedColors = shuffle(palette).slice(0, pairCount + 1);
  const uniqueColor = usedColors[pairCount];
  let cells = [];
  for (let i = 0; i < pairCount; i++) { cells.push(usedColors[i]); cells.push(usedColors[i]); }
  cells.push(uniqueColor);
  cells = shuffle(cells);

  const wrap = document.createElement('div');
  wrap.className = 'wire-grid';
  const cols = Math.ceil(Math.sqrt(cells.length));
  wrap.style.gridTemplateColumns = `repeat(${cols}, 54px)`;
  cells.forEach((color) => {
    const w = document.createElement('div');
    w.className = 'wire';
    w.style.background = color;
    w.dataset.color = color;
    wrap.appendChild(w);
  });
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('wirecut.hint');
  stage.appendChild(hint);

  function onClick(e) {
    const w = e.target.closest('.wire');
    if (!w) return;
    if (w.dataset.color === uniqueColor) {
      finish(true, {});
    } else {
      finish(false, { reason: 'wrong_wire' });
    }
  }
  wrap.addEventListener('click', onClick);
  current.cleanup = () => wrap.removeEventListener('click', onClick);
  startTimer(timeLimit, () => finish(false, { reason: 'timeout' }));
}


/* =========================================================================
   4) SKILLBAR - classic moving-marker / hit-the-zone bar (multi-stage)
   ========================================================================= */
function buildSkillbar(difficulty, timeLimit) {
  const stages = { easy: 2, medium: 3, hard: 4 }[difficulty];
  const speed = { easy: 1.6, medium: 2.4, hard: 3.4 }[difficulty]; // px per tick
  const zoneWidth = { easy: 70, medium: 50, hard: 36 }[difficulty];
  const trackWidth = 420;
  let stagesDone = 0;
  let misses = 0;
  const maxMisses = 3;
  setLives(maxMisses, maxMisses - misses);

  const wrap = document.createElement('div');
  wrap.className = 'bar-wrap';
  wrap.innerHTML = `
    <div class="bar-track" style="width:${trackWidth}px">
      <div class="bar-zone" id="zone"></div>
      <div class="bar-marker" id="marker"></div>
    </div>
    <div class="bar-progress" id="progress"></div>
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('skillbar.hint');
  stage.appendChild(hint);

  const zoneEl = wrap.querySelector('#zone');
  const markerEl = wrap.querySelector('#marker');
  const progressEl = wrap.querySelector('#progress');
  for (let i = 0; i < stages; i++) {
    const pip = document.createElement('div');
    pip.className = 'bar-pip';
    progressEl.appendChild(pip);
  }

  function newZone() {
    const x = randInt(0, trackWidth - zoneWidth);
    zoneEl.style.left = x + 'px';
    zoneEl.style.width = zoneWidth + 'px';
  }
  newZone();

  let pos = 0, dir = 1, raf;
  function loop() {
    pos += speed * dir;
    if (pos >= trackWidth - 4) dir = -1;
    if (pos <= 0) dir = 1;
    markerEl.style.left = pos + 'px';
    raf = requestAnimationFrame(loop);
  }
  loop();

  function onKey(e) {
    if (e.code !== 'Space') return;
    e.preventDefault();
    const zoneLeft = parseFloat(zoneEl.style.left);
    const inZone = pos >= zoneLeft && pos <= zoneLeft + zoneWidth;
    if (inZone) {
      flashResult(true);
      progressEl.children[stagesDone].classList.add('done');
      stagesDone++;
      if (stagesDone >= stages) { finish(true, { stages }); return; }
      newZone();
    } else {
      flashResult(false);
      misses++;
      setLives(maxMisses, maxMisses - misses);
      if (misses >= maxMisses) { finish(false, { reason: 'too_many_misses' }); return; }
    }
  }
  window.addEventListener('keydown', onKey);
  current.cleanup = () => { cancelAnimationFrame(raf); window.removeEventListener('keydown', onKey); };
  startTimer(timeLimit, () => finish(false, { reason: 'timeout' }));
}

/* =========================================================================
   5) CODEBREAKER - mastermind-style numeric code guessing
   ========================================================================= */
function buildCodebreaker(difficulty, timeLimit) {
  const codeLen = { easy: 3, medium: 4, hard: 5 }[difficulty];
  const maxGuesses = { easy: 10, medium: 8, hard: 6 }[difficulty];
  const code = Array.from({ length: codeLen }, () => randInt(0, 7));
  let guess = [];
  let guessesUsed = 0;

  const wrap = document.createElement('div');
  wrap.className = 'code-wrap';
  wrap.innerHTML = `
    <div class="history" id="history"></div>
    <div class="code-row" id="currentRow"></div>
    <div class="keypad" id="keypad"></div>
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('codebreaker.hint', { len: codeLen });
  stage.appendChild(hint);

  const historyEl = wrap.querySelector('#history');
  const rowEl = wrap.querySelector('#currentRow');
  const keypad = wrap.querySelector('#keypad');

  function renderRow() {
    rowEl.innerHTML = '';
    for (let i = 0; i < codeLen; i++) {
      const slot = document.createElement('div');
      slot.className = 'code-slot';
      slot.textContent = guess[i] !== undefined ? guess[i] : '';
      rowEl.appendChild(slot);
    }
    const submit = document.createElement('button');
    submit.className = 'btn primary';
    submit.textContent = t('codebreaker.enter');
    submit.disabled = guess.length !== codeLen;
    submit.onclick = submitGuess;
    rowEl.appendChild(submit);
  }

  for (let d = 0; d <= 7; d++) {
    const key = document.createElement('button');
    key.className = 'btn';
    key.textContent = d;
    key.onclick = () => {
      if (guess.length < codeLen) { guess.push(d); renderRow(); }
    };
    keypad.appendChild(key);
  }
  const clearBtn = document.createElement('button');
  clearBtn.className = 'btn';
  clearBtn.textContent = t('codebreaker.clear');
  clearBtn.onclick = () => { guess = []; renderRow(); };
  keypad.appendChild(clearBtn);

  function submitGuess() {
    if (guess.length !== codeLen) return;
    guessesUsed++;
    const codeCopy = [...code];
    const guessCopy = [...guess];
    let green = 0;
    for (let i = 0; i < codeLen; i++) {
      if (guessCopy[i] === codeCopy[i]) { green++; codeCopy[i] = null; guessCopy[i] = null; }
    }
    let yellow = 0;
    for (let i = 0; i < codeLen; i++) {
      if (guessCopy[i] === null) continue;
      const idx = codeCopy.indexOf(guessCopy[i]);
      if (idx !== -1) { yellow++; codeCopy[idx] = null; }
    }

    const row = document.createElement('div');
    row.className = 'code-row';
    row.innerHTML = guess.map(g => `<div class="code-slot">${g}</div>`).join('') +
      `<div class="code-feedback">${
        Array.from({length: green}).map(()=>'<div class="peg green"></div>').join('') +
        Array.from({length: yellow}).map(()=>'<div class="peg yellow"></div>').join('')
      }</div>`;
    historyEl.appendChild(row);
    historyEl.scrollTop = historyEl.scrollHeight;

    if (green === codeLen) {
      finish(true, { guesses: guessesUsed });
      return;
    }
    if (guessesUsed >= maxGuesses) {
      finish(false, { reason: 'out_of_guesses' });
      return;
    }
    guess = [];
    renderRow();
  }

  renderRow();
  startTimer(timeLimit, () => finish(false, { reason: 'timeout' }));
}

/* =========================================================================
   6) FINGERPRINT - find the tile matching the target print
   ========================================================================= */
function buildFingerprint(difficulty, timeLimit) {
  const gridN = { easy: 4, medium: 6, hard: 9 }[difficulty];

  function randPrint() {
    return { rings: randInt(4, 8), skew: randInt(-30, 30), offset: randInt(-10, 10), hue: randInt(180, 210) };
  }
  function printSvg(p, size = 70) {
    let paths = '';
    for (let i = 0; i < p.rings; i++) {
      const r = 6 + i * (size / 2 / p.rings);
      paths += `<path d="M ${size/2-r},${size/2+p.offset*0.1} A ${r},${r*0.7} ${p.skew} 0 1 ${size/2+r},${size/2+p.offset*0.1}"
        stroke="hsl(${p.hue},70%,${55+i*2}%)" stroke-width="2" fill="none"/>`;
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg>`;
  }

  const target = randPrint();
  const decoys = Array.from({ length: gridN - 1 }, () => {
    const d = randPrint();
    d.hue = target.hue; // same family, subtly different geometry
    return d;
  });
  const tiles = shuffle([target, ...decoys]);

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div style="text-align:center">
      <div class="hint" style="margin-bottom:6px">${t('fingerprint.target_label')}</div>
      <div class="fp-target">${printSvg(target, 88)}</div>
      <div class="fp-grid" id="grid" style="grid-template-columns:repeat(${Math.ceil(Math.sqrt(gridN))},70px)"></div>
    </div>
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('fingerprint.hint');
  stage.appendChild(hint);

  const grid = wrap.querySelector('#grid');
  tiles.forEach((t) => {
    const tile = document.createElement('div');
    tile.className = 'fp-tile';
    tile.innerHTML = printSvg(t, 68);
    tile.onclick = () => {
      if (t === target) finish(true, {});
      else finish(false, { reason: 'wrong_print' });
    };
    grid.appendChild(tile);
  });

  startTimer(timeLimit, () => finish(false, { reason: 'timeout' }));
}

/* =========================================================================
   7) RADIO TUNING - drag a dial to match the target frequency
   ========================================================================= */
function buildRadioTuning(difficulty, timeLimit) {
  const tolerance = { easy: 3.5, medium: 2.2, hard: 1.2 }[difficulty];
  const target = +(rand(80, 180)).toFixed(1);
  let value = +(rand(80, 180)).toFixed(1);
  let holdMs = 0;
  const holdNeeded = 900; // must stay locked-on this long

  const wrap = document.createElement('div');
  wrap.className = 'tune-wrap';
  wrap.innerHTML = `
    <div class="tune-readout" id="readout">${value.toFixed(1)} MHz</div>
    <div class="tune-target">${t('radiotuning.target_label', { value: target.toFixed(1) })}</div>
    <div class="tune-meter"><div class="tune-meter-fill" id="meterFill"></div></div>
    <input type="range" min="80" max="180" step="0.1" value="${value}" class="tune-slider" id="slider">
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('radiotuning.hint');
  stage.appendChild(hint);

  const readout = wrap.querySelector('#readout');
  const meterFill = wrap.querySelector('#meterFill');
  const slider = wrap.querySelector('#slider');

  function update() {
    value = parseFloat(slider.value);
    readout.textContent = value.toFixed(1) + ' MHz';
    const diff = Math.abs(value - target);
    const closeness = clamp(1 - diff / 15, 0, 1);
    meterFill.style.width = (closeness * 100) + '%';
  }
  slider.addEventListener('input', update);
  update();

  let raf;
  function loop() {
    const diff = Math.abs(value - target);
    if (diff <= tolerance) {
      holdMs += 16;
      readout.style.color = '#51cf66';
      if (holdMs >= holdNeeded) { finish(true, { target, value }); return; }
    } else {
      holdMs = Math.max(0, holdMs - 30);
      readout.style.color = '#4dabf7';
    }
    raf = requestAnimationFrame(loop);
  }
  loop();

  current.cleanup = () => { cancelAnimationFrame(raf); slider.removeEventListener('input', update); };
  startTimer(timeLimit, () => finish(false, { reason: 'timeout' }));
}

/* =========================================================================
   8) REACTION - press the matching arrow key before it disappears
   ========================================================================= */
function buildReaction(difficulty, timeLimit) {
  const rounds = { easy: 5, medium: 7, hard: 9 }[difficulty];
  const windowMs = { easy: 850, medium: 600, hard: 420 }[difficulty];
  const keys = [{ k: 'ArrowUp', s: '↑' }, { k: 'ArrowDown', s: '↓' }, { k: 'ArrowLeft', s: '←' }, { k: 'ArrowRight', s: '→' }];
  let round = 0;
  let awaiting = null;
  let roundTimeout = null;

  const wrap = document.createElement('div');
  wrap.className = 'reaction-wrap';
  wrap.innerHTML = `
    <div class="reaction-key" id="keyDisplay">?</div>
    <div class="reaction-progress" id="progress"></div>
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('reaction.hint');
  stage.appendChild(hint);

  const keyDisplay = wrap.querySelector('#keyDisplay');
  const progressEl = wrap.querySelector('#progress');
  for (let i = 0; i < rounds; i++) {
    const pip = document.createElement('div');
    pip.className = 'bar-pip';
    progressEl.appendChild(pip);
  }

  function nextRound() {
    if (round >= rounds) { finish(true, { rounds }); return; }
    awaiting = pick(keys);
    keyDisplay.textContent = awaiting.s;
    keyDisplay.style.borderColor = '#4dabf7';
    roundTimeout = setTimeout(() => {
      finish(false, { reason: 'too_slow', round });
    }, windowMs);
  }

  function onKey(e) {
    if (!awaiting) return;
    if (e.key === awaiting.k) {
      clearTimeout(roundTimeout);
      progressEl.children[round].classList.add('done');
      round++;
      awaiting = null;
      keyDisplay.textContent = '✓';
      keyDisplay.style.borderColor = '#51cf66';
      setTimeout(nextRound, 250);
    } else if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
      clearTimeout(roundTimeout);
      finish(false, { reason: 'wrong_key', round });
    }
  }
  window.addEventListener('keydown', onKey);
  current.cleanup = () => { clearTimeout(roundTimeout); window.removeEventListener('keydown', onKey); };

  nextRound();
  startTimer(timeLimit, () => finish(false, { reason: 'timeout' }));
}

/* =========================================================================
   9) SOBRIETY TEST - trace a wandering line within tolerance
   ========================================================================= */
function buildSobriety(difficulty, timeLimit) {
  const tolerance = { easy: 38, medium: 26, hard: 18 }[difficulty];
  const allowedOffMs = { easy: 4000, medium: 2600, hard: 1600 }[difficulty];
  const w = 460, h = 160;

  // build a wandering path
  const points = [];
  const segs = 8;
  for (let i = 0; i <= segs; i++) {
    points.push([ (w / segs) * i, h / 2 + Math.sin(i * 1.3) * (h / 2 - 25) * (i % 2 === 0 ? 1 : -1) ]);
  }
  const d = points.map((p, i) => (i === 0 ? `M ${p[0]} ${p[1]}` : `L ${p[0]} ${p[1]}`)).join(' ');

  const wrap = document.createElement('div');
  wrap.className = 'sobriety-wrap';
  // preserveAspectRatio="none" forces the SVG to stretch to exactly fill its
  // box with no letterboxing, so the linear mouse->viewBox scale math below
  // always matches what's actually drawn on screen.
  wrap.innerHTML = `
    <svg class="sobriety-svg" id="svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <path d="${d}" stroke="#373a40" stroke-width="${tolerance*2}" fill="none" stroke-linecap="round"/>
      <path d="${d}" stroke="#4dabf7" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
      <circle id="target" r="7" fill="#fcc419"/>
      <circle id="cursor" r="6" fill="none" stroke="#51cf66" stroke-width="2"/>
    </svg>
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('sobriety.hint');
  stage.appendChild(hint);

  const svg = wrap.querySelector('#svg');
  const pathEl = svg.querySelector('path');
  const targetEl = wrap.querySelector('#target');
  const cursorEl = wrap.querySelector('#cursor');
  const totalLen = pathEl.getTotalLength();

  let mouse = { x: w / 2, y: h / 2 };
  let offTime = 0;
  let elapsed = 0;

  function onMove(e) {
    const rect = svg.getBoundingClientRect();
    // safe because preserveAspectRatio="none" guarantees a uniform linear
    // mapping between client pixels and viewBox units on both axes
    const scaleX = w / rect.width, scaleY = h / rect.height;
    mouse.x = (e.clientX - rect.left) * scaleX;
    mouse.y = (e.clientY - rect.top) * scaleY;
  }
  svg.addEventListener('mousemove', onMove);

  let raf, last = Date.now();
  function loop() {
    const now = Date.now();
    const dt = now - last; last = now;
    elapsed += dt;

    const progress = clamp(elapsed / timeLimit, 0, 1);
    const len = progress * totalLen;
    const pt = pathEl.getPointAtLength(len);
    targetEl.setAttribute('cx', pt.x);
    targetEl.setAttribute('cy', pt.y);
    cursorEl.setAttribute('cx', mouse.x);
    cursorEl.setAttribute('cy', mouse.y);

    const dist = Math.hypot(mouse.x - pt.x, mouse.y - pt.y);
    if (dist > tolerance) {
      offTime += dt;
      targetEl.setAttribute('fill', '#fa5252');
      cursorEl.setAttribute('stroke', '#fa5252');
    } else {
      targetEl.setAttribute('fill', '#fcc419');
      cursorEl.setAttribute('stroke', '#51cf66');
    }

    if (offTime >= allowedOffMs) { finish(false, { reason: 'drifted_off_line' }); return; }
    if (progress >= 1) { finish(true, { offTime }); return; }
    raf = requestAnimationFrame(loop);
  }
  loop();

  current.cleanup = () => { cancelAnimationFrame(raf); svg.removeEventListener('mousemove', onMove); };
  // sobriety uses its own internal clock tied to timeLimit, but still show the HUD bar
  startTimer(timeLimit, () => {}); // visual only; real end condition handled in loop()
}

/* =========================================================================
   10) EVIDENCE BOARD - connect matching clue pairs (deductive linking)
   ========================================================================= */
function buildEvidenceBoard(difficulty, timeLimit) {
  const PAIR_POOL = t('evidenceboard.pairs');

  const pairCount = { easy: 3, medium: 4, hard: 5 }[difficulty];
  const maxMisses = { easy: 4, medium: 3, hard: 2 }[difficulty];
  let misses = 0, matched = 0;
  setLives(maxMisses, maxMisses - misses);

  const chosenPairs = shuffle(PAIR_POOL).slice(0, pairCount);
  let cards = [];
  chosenPairs.forEach((pair, pairId) => {
    cards.push({ text: pair[0], pairId, id: pairId + '-a' });
    cards.push({ text: pair[1], pairId, id: pairId + '-b' });
  });
  cards = shuffle(cards);

  const wrap = document.createElement('div');
  wrap.className = 'evi-grid';
  wrap.style.gridTemplateColumns = `repeat(${pairCount <= 3 ? 3 : 4}, 1fr)`;
  cards.forEach((c) => {
    const card = document.createElement('div');
    card.className = 'evi-card';
    card.textContent = c.text;
    card.dataset.id = c.id;
    card.dataset.pairId = c.pairId;
    wrap.appendChild(card);
  });
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('evidenceboard.hint');
  stage.appendChild(hint);

  let selected = null;

  function onClick(e) {
    const card = e.target.closest('.evi-card');
    if (!card || card.classList.contains('matched')) return;

    if (!selected) {
      selected = card;
      card.classList.add('selected');
      return;
    }
    if (selected === card) {
      card.classList.remove('selected');
      selected = null;
      return;
    }

    if (selected.dataset.pairId === card.dataset.pairId) {
      selected.classList.remove('selected');
      selected.classList.add('matched');
      card.classList.add('matched');
      matched++;
      flashResult(true);
      selected = null;
      if (matched >= pairCount) { finish(true, { pairs: matched }); }
    } else {
      card.classList.add('miss-flash');
      selected.classList.add('miss-flash');
      flashResult(false);
      misses++;
      setLives(maxMisses, maxMisses - misses);
      const prev = selected;
      setTimeout(() => { card.classList.remove('miss-flash'); prev.classList.remove('miss-flash', 'selected'); }, 300);
      selected = null;
      if (misses >= maxMisses) { finish(false, { reason: 'too_many_misses' }); }
    }
  }
  wrap.addEventListener('click', onClick);
  current.cleanup = () => wrap.removeEventListener('click', onClick);
  startTimer(timeLimit, () => finish(false, { reason: 'timeout' }));
}

/* =========================================================================
   11) CONTRADICTION - spot which witness statement contradicts the facts
   ========================================================================= */
function buildContradiction(difficulty, timeLimit) {
  const SCENARIOS = t('contradiction.scenarios');

  const maxMisses = { easy: 2, medium: 1, hard: 0 }[difficulty];
  let misses = 0;
  setLives(maxMisses + 1, maxMisses + 1 - misses);

  const scenario = pick(SCENARIOS);
  const statements = shuffle(scenario.statements);

  const wrap = document.createElement('div');
  wrap.className = 'contra-wrap';
  wrap.innerHTML = `<div class="contra-fact">${t('contradiction.fact_prefix')}${scenario.fact}</div>
    <div class="contra-list" id="list"></div>`;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('contradiction.hint');
  stage.appendChild(hint);

  const listEl = wrap.querySelector('#list');
  statements.forEach((s) => {
    const item = document.createElement('div');
    item.className = 'contra-item';
    item.textContent = s.text;
    item.onclick = () => {
      if (s.bad) {
        finish(true, {});
      } else {
        item.classList.add('miss-flash');
        flashResult(false);
        misses++;
        setLives(maxMisses + 1, maxMisses + 1 - misses);
        setTimeout(() => item.classList.remove('miss-flash'), 300);
        if (misses > maxMisses) finish(false, { reason: 'wrong_statement' });
      }
    };
    listEl.appendChild(item);
  });

  startTimer(timeLimit, () => finish(false, { reason: 'timeout' }));
}

/* =========================================================================
   12) SURVEILLANCE - scrub a timeline to find the exact frame the subject
   appears in. No visible target zone - you have to read the feedback text.
   ========================================================================= */
function buildSurveillance(difficulty, timeLimit) {
  const windowPct = { easy: 9, medium: 6, hard: 4 }[difficulty]; // % width of the hit window
  const maxAttempts = { easy: 5, medium: 4, hard: 3 }[difficulty];
  let attemptsUsed = 0;
  setLives(maxAttempts, maxAttempts - attemptsUsed);

  const totalSeconds = 180;
  const windowStart = rand(15, 100 - windowPct - 15); // % position, kept off the edges
  const windowEnd = windowStart + windowPct;
  let value = 0; // 0-100 %

  const wrap = document.createElement('div');
  wrap.className = 'surv-wrap';
  wrap.innerHTML = `
    <div class="surv-readout" id="readout">${t('surveillance.idle_readout')}</div>
    <input type="range" min="0" max="100" step="0.2" value="0" class="surv-slider" id="slider">
    <button class="btn primary" id="captureBtn" style="margin-top:14px">${t('surveillance.capture_btn')}</button>
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('surveillance.hint', { attempts: maxAttempts });
  stage.appendChild(hint);

  const readout = wrap.querySelector('#readout');
  const slider = wrap.querySelector('#slider');
  const captureBtn = wrap.querySelector('#captureBtn');

  function inWindow(v) { return v >= windowStart && v <= windowEnd; }

  function describe(v) {
    const secs = Math.round((v / 100) * totalSeconds);
    const mm = Math.floor(secs / 60).toString().padStart(2, '0');
    const ss = (secs % 60).toString().padStart(2, '0');
    const desc = inWindow(v) ? t('surveillance.subject_desc') : pick(t('surveillance.fillers'));
    return `FRAME ${mm}:${ss} — ${desc}`;
  }

  function update() {
    value = parseFloat(slider.value);
    readout.textContent = describe(value);
    readout.style.color = inWindow(value) ? '#51cf66' : '#4dabf7';
  }
  slider.addEventListener('input', update);
  update();

  function capture() {
    attemptsUsed++;
    if (inWindow(value)) {
      finish(true, { value, attempts: attemptsUsed });
      return;
    }
    flashResult(false);
    setLives(maxAttempts, maxAttempts - attemptsUsed);
    if (attemptsUsed >= maxAttempts) {
      finish(false, { reason: 'out_of_attempts' });
    }
  }
  captureBtn.addEventListener('click', capture);

  function onKey(e) {
    if (e.key === 'c' || e.key === 'C') capture();
  }
  window.addEventListener('keydown', onKey);

  current.cleanup = () => {
    slider.removeEventListener('input', update);
    captureBtn.removeEventListener('click', capture);
    window.removeEventListener('keydown', onKey);
  };
  startTimer(timeLimit, () => finish(false, { reason: 'timeout' }));
}

/* =========================================================================
   13) SPOT THE DIFFERENCE - compare two evidence photos
   ========================================================================= */
function buildSpotDiff(difficulty, timeLimit) {
  const shapeCount = { easy: 8, medium: 12, hard: 16 }[difficulty];
  const diffCount = { easy: 3, medium: 4, hard: 5 }[difficulty];
  const maxMisses = { easy: 5, medium: 4, hard: 3 }[difficulty];
  let misses = 0, found = 0;
  setLives(maxMisses, maxMisses - misses);

  const size = 220;
  const palette = ['#e74c3c', '#3498db', '#f1c40f', '#9b59b6', '#1abc9c', '#e67e22', '#ecf0f1', '#f783ac'];

  // Place shapes with a minimum center-to-center distance so circles never
  // overlap. Overlap was the root cause of "clicking the same dot" misfiring
  // as a miss: a click near a diff circle could land on a different circle
  // stacked underneath it, since closest() always resolves to whichever
  // element is topmost in the DOM at that pixel.
  const maxR = 13;
  const minDist = maxR * 2.6;
  const shapes = [];
  for (let n = 0; n < shapeCount; n++) {
    let placed = false;
    for (let attempt = 0; attempt < 60 && !placed; attempt++) {
      const candidate = { x: rand(18, size - 18), y: rand(18, size - 18), r: rand(6, maxR), color: pick(palette) };
      const collides = shapes.some((s) => Math.hypot(s.x - candidate.x, s.y - candidate.y) < minDist);
      if (!collides) { shapes.push(candidate); placed = true; }
    }
    // if we couldn't find a free spot after 60 tries, just stop adding more
    // (keeps shapes non-overlapping rather than forcing a cramped grid)
    if (!placed) break;
  }

  const diffIndices = new Set(shuffle(shapes.map((_, i) => i)).slice(0, Math.min(diffCount, shapes.length)));
  const shapes2 = shapes.map((s, i) => {
    if (!diffIndices.has(i)) return { ...s };
    const newColor = pick(palette.filter((c) => c !== s.color));
    return { ...s, color: newColor, r: s.r * (Math.random() > 0.5 ? 1.4 : 0.65), isDiff: true };
  });
  const actualDiffCount = diffIndices.size;

  function renderSvg(list, interactive) {
    const circles = list.map((s, i) =>
      `<circle cx="${s.x}" cy="${s.y}" r="${s.r}" fill="${s.color}" ${interactive ? `data-i="${i}" class="diff-shape"` : ''}/>`
    ).join('');
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${circles}</svg>`;
  }

  const wrap = document.createElement('div');
  wrap.className = 'spotdiff-wrap';
  wrap.innerHTML = `
    <div class="spotdiff-col">
      <div class="spotdiff-label">${t('spotdiff.original')}</div>
      <div class="spotdiff-photo">${renderSvg(shapes, false)}</div>
    </div>
    <div class="spotdiff-col">
      <div class="spotdiff-label">${t('spotdiff.evidence')}</div>
      <div class="spotdiff-photo" id="photo2">${renderSvg(shapes2, true)}</div>
    </div>
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('spotdiff.hint', { count: actualDiffCount });
  stage.appendChild(hint);

  const photo2 = wrap.querySelector('#photo2');
  function onClick(e) {
    const shape = e.target.closest('.diff-shape');
    if (!shape) return;
    const i = Number(shape.dataset.i);
    if (shapes2[i].clicked) return; // already resolved (correct or wrong) - ignore repeat clicks
    shapes2[i].clicked = true;

    if (shapes2[i].isDiff) {
      shape.setAttribute('stroke', '#51cf66');
      shape.setAttribute('stroke-width', '3');
      found++;
      flashResult(true);
      if (found >= actualDiffCount) { finish(true, { found }); }
    } else {
      shape.setAttribute('stroke', '#fa5252');
      shape.setAttribute('stroke-width', '2');
      shape.setAttribute('opacity', '0.5');
      flashResult(false);
      misses++;
      setLives(maxMisses, maxMisses - misses);
      if (misses >= maxMisses) { finish(false, { reason: 'too_many_misses' }); }
    }
  }
  photo2.addEventListener('click', onClick);
  current.cleanup = () => photo2.removeEventListener('click', onClick);
  startTimer(timeLimit, () => finish(false, { reason: 'timeout' }));
}

/* =========================================================================
   14) REDACTION - scan a report and click every occurrence of the flagged
   keyword before time runs out.
   ========================================================================= */
function buildRedaction(difficulty, timeLimit) {
  const WORD_BANK = t('redaction.word_bank').split(' ');
  const KEYWORDS = t('redaction.keywords');
  const keyword = pick(KEYWORDS);

  const totalWords = { easy: 70, medium: 100, hard: 130 }[difficulty];
  const occurrences = { easy: 4, medium: 6, hard: 8 }[difficulty];
  const maxMisses = { easy: 6, medium: 5, hard: 4 }[difficulty];
  let misses = 0, foundCount = 0;
  setLives(maxMisses, maxMisses - misses);

  const words = Array.from({ length: totalWords }, () => pick(WORD_BANK));
  const slots = shuffle(Array.from({ length: totalWords }, (_, i) => i)).slice(0, occurrences);
  slots.forEach((i) => { words[i] = keyword; });

  const wrap = document.createElement('div');
  wrap.className = 'redact-wrap';
  wrap.innerHTML = `<div class="redact-target">${t('redaction.target_label')} <span class="redact-key">${keyword.toUpperCase()}</span></div>
    <div class="redact-doc" id="doc"></div>`;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('redaction.hint', { count: occurrences });
  stage.appendChild(hint);

  const docEl = wrap.querySelector('#doc');
  words.forEach((w, i) => {
    const span = document.createElement('span');
    span.className = 'redact-word';
    span.textContent = w;
    span.dataset.i = i;
    span.dataset.key = (w === keyword) ? '1' : '0';
    docEl.appendChild(span);
    docEl.appendChild(document.createTextNode(' '));
  });

  function onClick(e) {
    const span = e.target.closest('.redact-word');
    if (!span) return;
    if (span.dataset.key === '1') {
      if (span.classList.contains('found')) return;
      span.classList.add('found');
      foundCount++;
      flashResult(true);
      if (foundCount >= occurrences) { finish(true, { found: foundCount }); }
    } else {
      span.classList.add('miss-flash');
      flashResult(false);
      misses++;
      setLives(maxMisses, maxMisses - misses);
      setTimeout(() => span.classList.remove('miss-flash'), 300);
      if (misses >= maxMisses) { finish(false, { reason: 'too_many_misses' }); }
    }
  }
  docEl.addEventListener('click', onClick);
  current.cleanup = () => docEl.removeEventListener('click', onClick);
  startTimer(timeLimit, () => finish(false, { reason: 'timeout' }));
}

/* =========================================================================
   15) INTERROGATION - multi-round dialogue tree, pick the question that
   keeps pressure on the suspect. Wrong choices cost "patience" (lives);
   running out of patience before the case's rounds are cleared is a fail.
   ========================================================================= */
function buildInterrogation(difficulty, timeLimit) {
  const cases = t('interrogation.cases');
  const caseData = pick(cases);
  const maxPatience = { easy: 4, medium: 3, hard: 2 }[difficulty];
  let patience = maxPatience;
  let round = 0;

  const wrap = document.createElement('div');
  wrap.className = 'interro-wrap';
  wrap.innerHTML = `
    <div class="interro-intro" id="intro">${caseData.intro}</div>
    <div class="interro-prompt" id="prompt"></div>
    <div class="interro-options" id="options"></div>
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('interrogation.hint');
  stage.appendChild(hint);

  const promptEl = wrap.querySelector('#prompt');
  const optionsEl = wrap.querySelector('#options');

  function renderPatience() {
    setLives(maxPatience, patience);
  }
  renderPatience();

  function renderRound() {
    if (round >= caseData.rounds.length) {
      finish(true, { rounds: round, message: t('interrogation.cracked') });
      return;
    }
    const r = caseData.rounds[round];
    promptEl.textContent = r.prompt;
    optionsEl.innerHTML = '';
    shuffle(r.options).forEach((opt) => {
      const btn = document.createElement('button');
      btn.className = 'interro-btn';
      btn.textContent = opt.text;
      btn.onclick = () => {
        if (opt.good) {
          btn.classList.add('good-flash');
          flashResult(true);
          round++;
          setTimeout(renderRound, 280);
        } else {
          btn.classList.add('bad-flash');
          flashResult(false);
          patience--;
          renderPatience();
          if (patience <= 0) {
            finish(false, { reason: 'suspect_lawyered_up', round });
            return;
          }
          setTimeout(() => btn.classList.remove('bad-flash'), 300);
        }
      };
      optionsEl.appendChild(btn);
    });
  }
  renderRound();

  startTimer(timeLimit, () => finish(false, { reason: 'timeout' }));
}

/* =========================================================================
   16) TRIANGULATION - three "signal towers" each report a distance to a
   hidden grid cell; click the cell where all three distance rings overlap.
   ========================================================================= */
function buildTriangulation(difficulty, timeLimit) {
  const gridN = { easy: 6, medium: 8, hard: 10 }[difficulty];
  const maxMisses = { easy: 4, medium: 3, hard: 2 }[difficulty];
  let misses = 0;
  setLives(maxMisses, maxMisses - misses);

  // pick a hidden target cell, then derive 3 tower positions + their exact
  // (rounded) distance to it so the rings genuinely intersect at the target
  const targetX = randInt(0, gridN - 1);
  const targetY = randInt(0, gridN - 1);

  function randomTower() {
    let x, y;
    do { x = randInt(0, gridN - 1); y = randInt(0, gridN - 1); }
    while (x === targetX && y === targetY);
    return { x, y };
  }
  const towers = [randomTower(), randomTower(), randomTower()].map((p) => ({
    ...p,
    dist: Math.round(Math.hypot(p.x - targetX, p.y - targetY) * 10) / 10,
  }));

  const cell = 36;
  const size = gridN * cell;

  const wrap = document.createElement('div');
  wrap.className = 'tri-wrap';
  wrap.innerHTML = `
    <div class="tri-readout" id="towerReadout">
      ${towers.map((tw, i) => `TOWER ${i + 1}: ${tw.dist} units from target`).join('<br>')}
    </div>
    <svg class="tri-svg" id="triSvg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"></svg>
  `;
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('triangulation.hint');
  stage.appendChild(hint);

  const svg = wrap.querySelector('#triSvg');

  // grid cells
  for (let gx = 0; gx < gridN; gx++) {
    for (let gy = 0; gy < gridN; gy++) {
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', gx * cell);
      rect.setAttribute('y', gy * cell);
      rect.setAttribute('width', cell - 2);
      rect.setAttribute('height', cell - 2);
      rect.setAttribute('fill', '#25262b');
      rect.setAttribute('stroke', '#373a40');
      rect.dataset.gx = gx;
      rect.dataset.gy = gy;
      rect.classList.add('tri-cell');
      svg.appendChild(rect);
    }
  }
  // tower markers + distance rings (rings are purely visual flavor; exact
  // matching is grid-based so fractional pixel rounding never matters)
  towers.forEach((tw, i) => {
    const cx = tw.x * cell + cell / 2, cy = tw.y * cell + cell / 2;
    const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    ring.setAttribute('cx', cx);
    ring.setAttribute('cy', cy);
    ring.setAttribute('r', tw.dist * cell);
    ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', ['#4dabf7', '#fcc419', '#f783ac'][i % 3]);
    ring.setAttribute('stroke-width', '1.5');
    ring.setAttribute('stroke-dasharray', '4 3');
    ring.setAttribute('opacity', '0.55');
    svg.appendChild(ring);

    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', cx);
    dot.setAttribute('cy', cy);
    dot.setAttribute('r', 5);
    dot.setAttribute('fill', ['#4dabf7', '#fcc419', '#f783ac'][i % 3]);
    svg.appendChild(dot);
  });

  function onClick(e) {
    const rect = e.target.closest('.tri-cell');
    if (!rect) return;
    const gx = Number(rect.dataset.gx), gy = Number(rect.dataset.gy);
    if (gx === targetX && gy === targetY) {
      rect.setAttribute('fill', 'rgba(81,207,102,0.5)');
      finish(true, { x: gx, y: gy });
    } else {
      rect.setAttribute('fill', 'rgba(250,82,82,0.4)');
      flashResult(false);
      misses++;
      setLives(maxMisses, maxMisses - misses);
      if (misses >= maxMisses) finish(false, { reason: 'too_many_misses' });
    }
  }
  svg.addEventListener('click', onClick);
  current.cleanup = () => svg.removeEventListener('click', onClick);
  startTimer(timeLimit, () => finish(false, { reason: 'timeout' }));
}

/* =========================================================================
   17) MEMORY SEARCH - tiles briefly reveal contraband icons, then flip face
   down; click every tile that showed contraband, in any order.
   ========================================================================= */
function buildMemorySearch(difficulty, timeLimit) {
  const gridN = { easy: 9, medium: 12, hard: 16 }[difficulty];
  const contrabandCount = { easy: 3, medium: 4, hard: 5 }[difficulty];
  const maxMisses = { easy: 3, medium: 2, hard: 2 }[difficulty];
  const previewMs = { easy: 3500, medium: 2600, hard: 1900 }[difficulty];
  let misses = 0, foundCount = 0;
  setLives(maxMisses, maxMisses - misses);

  const icons = t('memorysearch.icons');
  const contrabandIdx = new Set(shuffle(Array.from({ length: gridN }, (_, i) => i)).slice(0, contrabandCount));

  const wrap = document.createElement('div');
  wrap.className = 'mem-grid';
  const cols = Math.ceil(Math.sqrt(gridN));
  wrap.style.gridTemplateColumns = `repeat(${cols}, 56px)`;

  const tiles = [];
  for (let i = 0; i < gridN; i++) {
    const tile = document.createElement('div');
    tile.className = 'mem-tile revealed';
    tile.dataset.i = i;
    if (contrabandIdx.has(i)) {
      tile.textContent = pick(icons);
      tile.dataset.contraband = '1';
    }
    wrap.appendChild(tile);
    tiles.push(tile);
  }
  stage.appendChild(wrap);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = t('memorysearch.hint');
  stage.appendChild(hint);

  let locked = true;
  const revealTimeout = setTimeout(() => {
    tiles.forEach((tile) => {
      tile.classList.remove('revealed');
      tile.textContent = '';
    });
    locked = false;
  }, previewMs);

  function onClick(e) {
    if (locked) return;
    const tile = e.target.closest('.mem-tile');
    if (!tile || tile.classList.contains('resolved')) return;
    tile.classList.add('resolved');

    if (tile.dataset.contraband === '1') {
      tile.classList.add('revealed', 'found-correct');
      tile.textContent = '✓';
      foundCount++;
      flashResult(true);
      if (foundCount >= contrabandCount) finish(true, { found: foundCount });
    } else {
      tile.classList.add('found-wrong');
      flashResult(false);
      misses++;
      setLives(maxMisses, maxMisses - misses);
      if (misses >= maxMisses) finish(false, { reason: 'too_many_misses' });
    }
  }
  wrap.addEventListener('click', onClick);
  current.cleanup = () => { clearTimeout(revealTimeout); wrap.removeEventListener('click', onClick); };
  startTimer(timeLimit, () => finish(false, { reason: 'timeout' }));
}

</script>
<script>
/* =========================================================================
   srm-minigames - html/js/games-ambulance.js
